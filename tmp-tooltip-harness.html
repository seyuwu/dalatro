<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>hero badge tooltip harness</title>
<link rel="stylesheet" href="src/ui/styles.css">
<style>
  body { margin: 0; background: #141a12; }
  /* сцена руки героя: карточка в нижней трети, сверху место для тултипов */
  #wrap { position: fixed; left: 430px; top: 420px; width: 200px; }
  #wrap .hero-card { width: 200px; display: block; }
  #wrap .hero-art { height: 120px; background: #223; }
</style>
</head>
<body>
<div id="wrap">
  <button class="hero-card int">
    <div class="hero-art"><span class="hero-vignette"></span><span class="hero-name">Invoker</span></div>
    <div class="hero-card-bottom">
      <span class="hero-attribute">◆ Интеллект</span>
      <span class="hero-ability">Invoke <span class="augh-mark" data-tip>🧪<span class="pop"><strong>🧪 Quick Cast</strong><p>Осколок Аганима: длинное описание штуки. Этот тултип должен открыться ПОВЕРХ тултипа героя, а не за ним.</p><small>Осколок Аганима</small></span></span></span>
      <div class="card-foot"><span>9 <svg width="10" height="10"></svg></span><kbd>1</kbd></div>
    </div>
    <span class="hero-tooltip">
      <strong>Invoke</strong>
      <p>Описание способности героя: большой тултип над картой. Его нижний правый угол в игре перекрывает тултип бейджа аугмента.</p>
      <div class="augh-tip owned">🧪 <b>Осколок Аганима · Quick Cast</b><span class="augh-desc">Каталог аугментов героя в тултипе.</span></div>
      <div class="augh-tip">✨ <b>Скипетр Аганима · Invoke Mastery</b><span class="augh-desc">Ещё одна строка каталога.</span></div>
      <small>Сила 9 · Интеллект — 5 карт одного цвета = флеш</small>
    </span>
  </button>
</div>
</body>
</html>
