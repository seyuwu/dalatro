          ${state.player.items.includes(item.id) ? `<span class="mint">${icon("check", 15)}</span>` : ""}
        </button>`).join("");
    } else if (tab === "deck") {
      // Лаборатория: только нанятые/стартовые герои текущего забега.
      const ownedUids = [...state.player.handUids, ...state.player.deckUids, ...state.player.discardUids];
      const labMode = state.phase === "shop";
      const ownedHeroes = ownedUids
        .map((uid) => ({ uid, hero: Content.heroes.byId[state.cards[uid].heroId] }))
        .filter(({ hero }) => hero.name.toLowerCase().includes(search));
      // дедуп по герою (дублей нет, но на всякий случай)
      const seen = new Set();
      grid = ownedHeroes.filter(({ hero }) => !seen.has(hero.id) && seen.add(hero.id)).map(({ uid, hero: hr }) => {
        const where = state.player.handUids.includes(uid) ? "● В руке" : state.player.deckUids.includes(uid) ? "◈ В колоде" : "↺ В сбросе";
        const rank = heroRank(state, hr.id);
        const trained = rank !== hr.power;
        const canExile = ownedUids.length > Game.DECK_MIN && (state.run.campBoon || state.run.gold >= Game.EXILE_COST);
        const canTrain = rank < Game.TRAIN_RANK_MAX && state.run.gold >= Game.TRAIN_COST;
        return `<div class="collection-hero ${hr.attr}">
          <div class="collection-portrait">${Art.heroArt(hr)}<b>${rank}</b></div>
          <div><strong>${hr.name}${trained ? ` <span class="trained-badge">+${rank - hr.power} тренировка</span>` : ""}</strong>
            <span class="hero-attribute">${ATTR_SYMBOLS[Game.heroAttr(state, hr.id)]} ${ATTR_NAMES[Game.heroAttr(state, hr.id)]}${Game.heroAttr(state, hr.id) !== hr.attr ? " (зелье)" : ""} · сила ${rank}${(state.run.heroXp || {})[hr.id] ? ` · опыт ${(state.run.heroXp || {})[hr.id]} (ур. ${Game.heroLevel(state, hr.id)})` : ""}</span>
            <p>${heroDesc(hr)}</p>
            <small class="gold">${where}</small>
            <small class="augh-lab">${["shard", "scepter"].map((k) => {
      const a = Content.aghanims.forHero(hr.id, k);
      if (!a) return "";
      const owned = !!((state.run.aghanims || {})[hr.id] || {})[k];
      const label = k === "scepter" ? "Скипетр Аганима" : "Осколок Аганима";
      return `<span class="augh-tip ${owned ? "owned" : ""}">${a.emoji} <b>${label} · ${a.name}</b><span class="augh-desc">${esc(a.desc)}</span></span>`;
    }).filter(Boolean).join("")}</small>
            ${labMode ? `<div class="attr-change-row">${["str", "agi", "int", "uni"].map((a) => {
      const cur = Game.heroAttr(state, hr.id);
      const has = (state.run.attrCharges || 0) > 0;
      return `<button class="attr-change ${a} ${cur === a ? "current" : ""}" data-action="change-attr" data-id="${hr.id}" data-attr="${a}"
                ${!has || cur === a ? "disabled" : ""} title="Сменить атрибут на ${ATTR_NAMES[a]} (1 заряд зелья)">${ATTR_SYMBOLS[a]}</button>`;
    }).join("")}${(state.run.attrCharges || 0) === 0 ? '<small class="attr-hint">нет зарядов — купи «Зелье атрибута» в лавке</small>' : ""}</div>` : ""}
            ${labMode ? `<div class="lab-actions">
              <button class="lab-button danger" data-action="exile" data-id="${hr.id}" ${canExile ? "" : "disabled"}
                title="${ownedUids.length <= Game.DECK_MIN ? "В колоде минимум 8 карт" : "Безвозвратное удаление из колоды"}">
                ${state.run.campBoon ? "Уволить бесплатно" : `Уволить · ${Game.EXILE_COST} G`}</button>
              <button class="lab-button" data-action="train" data-id="${hr.id}" ${canTrain ? "" : "disabled"}
                title="Постоянно +1 к рангу героя">Тренировать +1 · ${Game.TRAIN_COST} G</button>
            </div>` : ""}
          </div></div>`;
      }).join("");
    } else {
      const heroes = Content.heroes.list.filter((hr) => hr.name.toLowerCase().includes(search));
      grid = heroes.map((hr) => {
        const owned = [...state.player.handUids, ...state.player.deckUids, ...state.player.discardUids]
          .some((uid) => state.cards[uid].heroId === hr.id);
        return `<div class="collection-hero ${hr.attr}">
          <div class="collection-portrait">${Art.heroArt(hr)}<b>${hr.power}</b></div>
          <div><strong>${hr.name}</strong>
            <span class="hero-attribute">${ATTR_SYMBOLS[hr.attr]} ${ATTR_NAMES[hr.attr]}</span>
            <p>${heroDesc(hr)}</p>
            ${hr.inDeck ? "" : owned ? '<small class="mint">нанят</small>' : '<small>нанять можно в таверне (лавка)</small>'}
          </div></div>`;
      }).join("");
    }
    return `<span class="section-label mint">${icon("layers", 15)}КОЛЛЕКЦИЯ</span>
      <h2>${tab === "deck" ? (state.phase === "shop" ? "Лаборатория колоды" : "Твоя колода") : "Всё для идеального тимфайта"}</h2>
      <div class="collection-toolbar">
        <div class="tabs">${tabs}</div>
        <input aria-label="Поиск в коллекции" placeholder="Найти по имени..." value="${esc(UIState.search)}" data-action-input="search">
      </div>
      ${tab === "deck" ? `<div class="deck-summary"><span>В руке <b>${state.player.handUids.length}</b></span><span>В колоде <b>${state.player.deckUids.length}</b></span><span>В сбросе <b>${state.player.discardUids.length}</b></span></div>` : ""}
      ${state.phase === "shop" && UIState.labFocus === "train" ? `<div class="lab-focus-banner train">🏋️ Режим тренировки: +1 к рангу героя за ${Game.TRAIN_COST} G — навсегда, влияет на силу в бою.</div>` : ""}
      ${state.phase === "shop" && UIState.labFocus === "exile" ? `<div class="lab-focus-banner exile">⚔️ Режим увольнения: герой покинет колоду${state.run.campBoon ? " бесплатно (привал лагеря)" : ` за ${Game.EXILE_COST} G`}.</div>` : ""}
      <div class="collection-grid">${grid || '<div class="empty-search">Ничего не найдено. Попробуй другое имя.</div>'}</div>`;
  }

  function settingsModalHtml() {
    return `<span class="section-label mint">${icon("settings", 15)}НАСТРОЙКИ</span>
      <h2>Твой комфортный темп.</h2>
      <div class="setting-row"><div><strong>Звуки боя</strong><p>Короткий звуковой эффект при атаке</p></div>
        <button class="toggle ${Sfx.isMuted() ? "" : "on"}" data-action="toggle-sound" role="switch" aria-checked="${!Sfx.isMuted()}"><span></span></button></div>
      <div class="setting-row"><div><strong>Анимации</strong><p>Удары, подъём карт и эффекты урона</p></div>
        <button class="toggle ${UIState.motion ? "on" : ""}" data-action="toggle-motion" role="switch" aria-checked="${UIState.motion}"><span></span></button></div>
      <div class="settings-shortcuts"><h3>Горячие клавиши</h3>
        <p><span>Выбрать героя</span><kbd>1 – ${DeckSys.HAND_SIZE}</kbd></p>
        <p><span>Начать тимфайт</span><kbd>Enter</kbd></p>
        <p><span>ТП-сброс</span><kbd>R</kbd></p>
        <p><span>Лавка: купить / обновить / дальше</span><kbd>1–5 · R · ↵</kbd></p>
        <p><span>Развилка: выбрать тропу</span><kbd>1 – 3</kbd></p>
        <p><span>Debug-песочница</span><kbd>D</kbd></p>
        <p><span>Закрыть / снять выбор</span><kbd>Esc</kbd></p></div>
      <div class="muted-note">${icon("check", 13)} Забег автоматически сохраняется в этом браузере.</div>`;
  }

  function historyModalHtml(state) {
    return `<span class="section-label mint">${icon("history", 15)}ЖУРНАЛ БОЯ</span>
      <h2>История твоего забега</h2>
      <div class="history-summary">
        <span>Всего урона <strong>${state.stats.totalDamage.toLocaleString("ru")}</strong></span>
        <span>Лучший удар <strong>${state.stats.biggestHit.toLocaleString("ru")}</strong></span>
        <span>Импульс <strong>${state.run.momentum || 0}</strong></span></div>
      <div class="full-history">${state.log.slice().reverse().map((line, i) =>
      `<div><span>${String(state.log.length - i).padStart(2, "0")}</span><p>${esc(line)}</p></div>`).join("")}</div>`;
  }

  function newRunModalHtml() {
    return `<div class="reset-icon">${icon("rotate", 28)}</div>
      <h2>Ещё один забег?</h2>
      <p class="modal-description">Текущий прогресс будет сброшен. Тот же seed — тот же забег: удачи можно проверить дважды.</p>
      <span class="section-label">СТАРТОВЫЙ ОТРЯД</span>
      ${starterPickerHtml()}
      <span class="section-label">РАНГ СЛОЖНОСТИ</span>
      ${rankPickerHtml()}
      <input id="seed-input-modal" class="seed-modal-input" placeholder="Seed (пусто = случайный)" maxlength="12">
      <div class="modal-actions">
        <button class="secondary-button" data-action="close-modal">Продолжить текущий</button>
        <button class="primary-button" data-action="restart">Начать заново ${icon("arrow", 15)}</button>
      </div>`;
  }

  function scoreModalHtml(state) {
    const preview = computePreview(state);
    if (!preview) return "";
    return `<span class="section-label mint">${icon("zap", 15)}РАСЧЁТ ТИМФАЙТА</span>
      <h2>${preview.combo.name}</h2>
      <p class="modal-description">Порядок: комбинация → способности героев (по слотам) → предметы → ставка и импульс → модификаторы башни.</p>
      <div class="score-breakdown">${preview.steps.map((st, i) =>
      `<div><span>${st.icon || i + 1}</span><p>${esc(st.label)}</p></div>`).join("")}</div>
      <div class="breakdown-total"><span>${preview.power} силы × ${Math.round(preview.mult * 100) / 100}${preview.damage && preview.power ? ` → башне останется ${Math.max(0, preview.towerHpAfter ?? 0)} HP` : ""}</span>
        <strong>${preview.damage} <small>урона</small></strong></div>`;
  }

  function detailModalHtml(state) {
    const item = UIState.detail ? Content.items.byId[UIState.detail] : null;
    if (!item) return "";
    const synergies = Advisor.itemSynergy(item.id, state);
    const owned = state.player.items.includes(item.id);
    const inShop = state.phase === "shop";
    const sellValue = Economy.sellValue(item.id);
    return `<div class="item-detail-image">${Art.itemIcon(item)}</div>
      <span class="section-label gold">${RARITY_NAMES[item.rarity]} предмет · ${item.cost} G</span>
      <h2>${item.name}</h2>
      <p class="modal-description">${esc(item.desc)}</p>
      ${synergies.length ? `<div class="detail-synergies"><span class="section-label">ЧТО ДАСТ ТВОЕМУ ЗАБЕГУ</span>
        ${synergies.map((s) => `<div class="inspect-line">${icon("sparkles", 11)} ${esc(s)}</div>`).join("")}</div>` : ""}
      <div class="detail-tip">${icon("sparkles", 18)}<p>Предмет действует на каждый тимфайт. Его вклад виден в превью и в расчёте (кнопка с названием комбинации).</p></div>
      ${owned && inShop
      ? `<button class="secondary-button full-width" data-action="sell" data-id="${item.id}">Продать за ${sellValue} ${icon("coins", 14)}</button>`
      : owned ? '<div class="muted-note">Продажа доступна в лавке между волнами.</div>' : ""}`;
  }

  // Пикер сброса «Второго дыхания»: клик по карте возвращает её в руку.
  function discardPickerHtml(state) {
    const uids = (state.player.discardUids || []).filter((uid) => state.cards[uid]);
    return `<span class="section-label mint">♻️ ВТОРОЕ ДЫХАНИЕ</span>
      <h2>Кого вернуть в руку?</h2>
      <p class="modal-description">Карта вернётся из сброса — спишется один заряд.</p>
      ${uids.length ? `<div class="recruit-row">${uids.map((uid) => {
        const hero = Content.heroes.byId[state.cards[uid].heroId];
        return `<div class="recruit-card ${Game.heroAttr(state, hero.id) !== hero.attr ? Game.heroAttr(state, hero.id) : hero.attr}" data-action="pick-discard" data-uid="${uid}" role="button" data-tip>
          <div class="recruit-portrait">${Art.heroArt(hero)}<b>${hero.power}</b></div>
          <div class="recruit-info"><strong>${hero.name}</strong>
            <span class="hero-attribute">${ATTR_SYMBOLS[Game.heroAttr(state, hero.id)]} ${ATTR_NAMES[Game.heroAttr(state, hero.id)]}</span>
            <small>${esc(heroDesc(hero))}</small></div>
        </div>`;
      }).join("")}</div>` : '<div class="muted-note">Сброс пуст — заряд останется при тебе.</div>'}`;
  }

  function modalBodyHtml(state) {
    switch (UIState.modal) {
      case "help": return helpModalHtml(state);
      case "collection": return collectionModalHtml(state);
      case "settings": return settingsModalHtml();
      case "history": return historyModalHtml(state);
      case "new": return newRunModalHtml();
      case "score": return scoreModalHtml(state);
      case "detail": return detailModalHtml(state);
      case "discard-pick": return discardPickerHtml(state);
      default: return "";
    }
  }

  // ---------- fight animation ----------

  function playFightAnimation(resolution, onDone) {
    const battlefield = document.getElementById("battlefield");
    if (battlefield && UIState.motion) {
      battlefield.classList.add("attacking");
      const burst = document.createElement("div");
      burst.className = "damage-burst";
      burst.innerHTML = resolution.blocked ? "ГЛИФ!" : `−${resolution.damage.toLocaleString("ru")}<small>УРОНА</small>`;
      battlefield.appendChild(burst);
      // Крупный красный «КРИТ!» поверх урона: шанс-эффекты должны быть явно
      // подтверждены после боя (ПА, Daedalus, Bloodthorn).
      if ((resolution.crits || []).length) {
        const crit = document.createElement("div");
        crit.className = "crit-burst";
        crit.innerHTML = `КРИТ!<small>${esc(resolution.crits.join(" · "))}</small>`;
        battlefield.appendChild(crit);
        setTimeout(() => crit.remove(), 1400);
      }
      setTimeout(() => { burst.remove(); battlefield.classList.remove("attacking"); }, 1000);
    }
    const overlay = document.createElement("div");
    overlay.className = "fight-overlay";
    overlay.innerHTML = `
      <div class="fight-box">
        ${h("div", "fight-combo", resolution.combo.name)}
        <div class="fight-steps"></div>
        ${h("div", "fight-hint", "клик — пропустить")}
      </div>`;
    document.body.appendChild(overlay);
    const stepsEl = overlay.querySelector(".fight-steps");
    let timers = [];
    let finished = false;
    function finish() {
      if (finished) return;
      finished = true;
      timers.forEach(clearTimeout);
      overlay.remove();
      onDone();
    }
    overlay.addEventListener("click", finish);
    resolution.steps.forEach((step, i) => {
      timers.push(setTimeout(() => {
        const el = document.createElement("div");
        el.className = "preview-step appear";
        el.innerHTML = `<span class="step-icon">${step.icon}</span><span>${esc(step.label)}</span>`;
        stepsEl.appendChild(el);
      }, 80 + i * 140));
    });
    timers.push(setTimeout(finish, 300 + resolution.steps.length * 140 + 500));
  }

  // ---------- entry ----------

  function app() {
    return document.getElementById("app");
  }

  function render(state) {
    document.body.classList.toggle("reduced-motion", !UIState.motion);
    // Покупки в лавке не должны поднимать скролл наверх: запоминаем позиции
    // прокручиваемых контейнеров и возвращаем их после перерисовки.
    const prevShop = document.querySelector(".shop");
    const shopScroll = prevShop ? prevShop.scrollTop : 0;
    const prevModal = document.querySelector(".modal");
    const modalScroll = prevModal ? prevModal.scrollTop : 0;
    switch (state.phase) {
      case "title": renderTitle(state); break;
      case "wave": renderWave(state); break;
      case "route": renderRoute(state); break;
      case "shop": renderShop(state); break;
      case "victory": renderVictory(state); break;
      case "gameover": renderGameover(state); break;
    }
    const shop = document.querySelector(".shop");
    if (shop && shopScroll) shop.scrollTop = shopScroll;
    const modal = document.querySelector(".modal");
    if (modal && modalScroll) modal.scrollTop = modalScroll;
  }

  return { render, UIState, handOrder, playFightAnimation, toast, tipText: (i) => TIPS[i % TIPS.length].t + " " + TIPS[i % TIPS.length].p };
})();

</script>
  <script>
// Dalatro — main: app state holder + event delegation. UI events become actions.
// UI prefs (sound/motion/onboarding) live here, game state in Game.dispatch.
(function () {
  const SAVE_KEY = "dalatro_save_v3"; // v3: архетипы старта + слоты предметов (старые сейвы не подхватываются)
  const PREFS_KEY = "dalatro_prefs_v3";
  const ONBOARD_KEY = "dalatro_onboard_v3";
  const RANKS_KEY = "dalatro_ranks_v1"; // прогресс лиги: максимальный открытый ранг
  const SCORES_KEY = "dalatro_scores_v1"; // локальный лидерборд (фаза H)

  // Мёрж дефолтов createInitialState: новые поля стейта (архетип, флаги перков,
  // слоты) не роняют сейвы, сохранённые в более ранней точке этой же версии.
  function normalizeState(s) {
    const fresh = Game.createInitialState("");
    return {
      ...fresh, ...s,
      run: { ...fresh.run, ...(s.run || {}) },
      player: { ...fresh.player, ...(s.player || {}) },
      combat: { ...fresh.combat, ...(s.combat || {}) },
      shop: { ...fresh.shop, ...(s.shop || {}) },
      stats: { ...fresh.stats, ...(s.stats || {}) },
    };
  }

  function loadScores() {
    try { return JSON.parse(localStorage.getItem(SCORES_KEY)) || []; } catch (e) { return []; }
  }

  // Запись забега (спек §8.1): один раз за забег, хвост 50 записей.
  function recordRun(state) {
    if (state.run.scoreRecorded) return;
    state.run.scoreRecorded = true;
    const entry = {
      date: Date.now(),
      seed: state.seedCode,
      rank: state.run.rank || 1,
      score: Game.scoreOf(state),
      waves: Math.min(state.run.waveIndex + (state.phase === "victory" ? 1 : 0), Content.waves.order.length),
      won: state.phase === "victory",
      timeMs: Math.max(0, Date.now() - (state.run.startedAt || Date.now())),
      deaths: state.run.deathsCount || 0,
    };
    const list = loadScores();
    UI.UIState.newRecord = !list.length || entry.score > Math.max(...list.map((e) => e.score));
    list.push(entry);
    try { localStorage.setItem(SCORES_KEY, JSON.stringify(list.slice(-50))); } catch (e) { /* приватный режим */ }
    UI.UIState.scores = loadScores();
  }

  function loadUnlockedRank() {
    try {
      const raw = Number(localStorage.getItem(RANKS_KEY));
      return raw >= 1 && raw <= Ranks.MAX_RANK ? raw : 1;
    } catch (e) { return 1; }
  }

  function saveUnlockedRank(rank) {
    try { localStorage.setItem(RANKS_KEY, String(rank)); } catch (e) { /* приватный режим */ }
  }

  function saveState() {
    try {
      const rng = Rng.current();
      const payload = { ...state, rngCount: rng ? rng.drawCount() : 0 };
      localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    } catch (e) { /* приватный режим — без сейва */ }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !s.phase || s.phase === "title") return null;
      // Recreate the seeded stream and fast-forward to the saved position.
      if (s.seedCode) {
        const rng = Rng.create(s.seedCode);
        rng.fastForward(s.rngCount || 0);
        Rng.setActive(rng);
      }
      return normalizeState(s);
    } catch (e) { return null; }
  }

  function loadPrefs() {
    try {
      const raw = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
      UI.UIState.motion = raw.motion !== false;
      if (raw.sound === false && !Sfx.isMuted()) Sfx.toggleMuted();
    } catch (e) { /* defaults */ }
  }

  function savePrefs() {
    try {
      localStorage.setItem(PREFS_KEY, JSON.stringify({ sound: !Sfx.isMuted(), motion: UI.UIState.motion }));
    } catch (e) { /* ignore */ }
  }

  loadPrefs();
  UI.UIState.unlockedRank = loadUnlockedRank();
  UI.UIState.scores = loadScores();
  UI.UIState.scoreView = "score";
  let state = loadState() || Game.createInitialState("");
  let fighting = false;

  let audioContext = null;
  function playTone() {
    // Оставлен для совместимости: основной звук — через Sfx (ui/audio.js).
    Sfx.play("attack");
  }

  function rerender() {
    UI.render(state);
  }
  window.__dalatroRerender = rerender;

  function dispatchAndRender(action) {
    // Всплывает только реально обновлённое: новая раздача/шоп/реролл.
    // Выбор карты состояние коллекций не меняет — всё остаётся на местах.
    const HAND_DEAL = new Set(["START_RUN", "CONFIRM_FIGHT", "DISCARD", "RETRY_WAVE", "LEAVE_SHOP", "TAKE_ROUTE", "DEBUG_DRAW"]);
    const SHOP_REFRESH = new Set(["ENTER_SHOP", "REROLL_SHOP"]);
    const INV_REFRESH = new Set(["BUY_ITEM", "SELL_ITEM"]);
    const LAB_REFRESH = new Set(["BUY_RECRUIT", "EXILE_HERO"]);
    if (HAND_DEAL.has(action.type)) UI.UIState.animHand = true;
    if (SHOP_REFRESH.has(action.type)) {
      UI.UIState.animShop = true;
      UI.UIState.animInv = true;
      UI.UIState.animLab = true;
    }
    if (INV_REFRESH.has(action.type)) UI.UIState.animInv = true;
    if (LAB_REFRESH.has(action.type)) UI.UIState.animLab = true;
    if (action.type === "LEAVE_SHOP") UI.UIState.animRoute = true;

    state = Game.dispatch(state, action);
    saveState();

    // Победа на ранге N открывает N+1 навсегда (localStorage). Плашка — на
    // экране победы; сбросится при старте нового забега.
    if (state.phase === "victory" && !fighting) {
      const cleared = state.run.rank || 1;
      if (cleared >= UI.UIState.unlockedRank && UI.UIState.unlockedRank < Ranks.MAX_RANK) {
        const next = Math.min(Ranks.MAX_RANK, cleared + 1);
        UI.UIState.unlockedRank = next;
        UI.UIState.unlockBanner = Content.ranks.byId[next].name;
        saveUnlockedRank(next);
      }
    }

    // Конец забега: запись в локальный лидерборд (фаза H).
    if (state.phase === "victory" || state.phase === "gameover") recordRun(state);

    // Fight: animate the resolution stack first, then reveal the result.
    if (action.type === "CONFIRM_FIGHT" && state.combat.lastResolution) {
      fighting = true;
      Sfx.play("attack");
      const resolution = state.combat.lastResolution;
      UI.playFightAnimation(resolution, () => {
        fighting = false;
        if (state.combat.outcome === "cleared") Sfx.play("win");
        else if (state.combat.outcome === "failed") Sfx.play("lose");
        rerender();
      });
      return;
    }
    rerender();
  }

  function closeModal() {
    UI.UIState.modal = null;
    UI.UIState.detail = null;
    UI.UIState.labFocus = null;
    rerender();
  }

  function clearSelection() {
    state.combat.selectedUids = [];
    rerender();
  }

  // Перетаскивание героев по слотам формации: занятые меняются местами,
  // пустой слот принимает героя на это место. Порядок = позиции в бою.
  // Pointer-события вместо HTML5 DnD — работают с любым вводом и не зависят
  // от нативного dragstart.
  let drag = null;

  function reorderSelection(from, to) {
    const uids = state.combat.selectedUids;
    if (from === to || from < 0 || !uids[from]) return;
    if (uids[to]) {
      [uids[from], uids[to]] = [uids[to], uids[from]];
    } else {
      const [moved] = uids.splice(from, 1);
      uids.splice(to, 0, moved);
    }
    // Счётчик перестановок формаций: кормит скипетры Pudge/Axe и шарды
    // PA/Legion/Anti-Mage/Tusk (docs/AGHANIMS.md).
    state.combat.movesUsed = (state.combat.movesUsed || 0) + 1;
    rerender();
  }

  function clearDragMarks() {
    document.querySelectorAll(".formation-slot.dragging, .formation-slot.drag-over")
      .forEach((el) => el.classList.remove("dragging", "drag-over"));
  }

  document.addEventListener("pointerdown", (e) => {
    if (e.button !== 0 || state.phase !== "wave" || state.combat.outcome || fighting) return;
    const slot = e.target.closest && e.target.closest(".formation-slot.occupied[data-idx]");
    if (!slot) return;
    drag = { from: Number(slot.dataset.idx), started: false, x: e.clientX, y: e.clientY };
  });

  document.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (!drag.started) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
      drag.started = true;
      document.querySelector(`.formation-slot[data-idx="${drag.from}"]`)?.classList.add("dragging");
    }
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const slot = under && under.closest(".formation-slot[data-idx]");
    document.querySelectorAll(".formation-slot.drag-over").forEach((el) => el.classList.remove("drag-over"));
    if (slot && Number(slot.dataset.idx) !== drag.from) slot.classList.add("drag-over");
  });

  document.addEventListener("pointerup", (e) => {
    if (!drag) return;
    const { from, started } = drag;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const slot = under && under.closest(".formation-slot[data-idx]");
    drag = null;
    clearDragMarks();
    if (!started || !slot) return;
    const to = Number(slot.dataset.idx);
    if (to !== from) reorderSelection(from, to);
  });

  document.addEventListener("pointercancel", () => {
    drag = null;
    clearDragMarks();
  });

  function startRun(seedCode) {
    // Ядро скоринга одно — формации. Тумблер и ?rules= выпилены:
    // какой-либо выбор режима больше не предусмотрен.
    state = Game.dispatch(state, { type: "START_RUN", seedCode, rules: "formation", rank: UI.UIState.rankDraft || 1, starterId: UI.UIState.starterDraft || "standard" });
    UI.UIState.unlockBanner = null;
    saveState();
    if (!localStorage.getItem(ONBOARD_KEY)) {
      UI.UIState.onboarding = true;
      UI.UIState.onboardingStep = 0;
    }
    rerender();
  }

  document.getElementById("app").addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el || fighting) return;
    const action = el.dataset.action;
    switch (action) {
      case "start": {
        const input = document.getElementById("seed-input");
        startRun(input ? input.value : "");
        break;
      }
      case "select": Sfx.play("select"); dispatchAndRender({ type: "SELECT_CARD", uid: el.dataset.uid }); break;
      case "pick-rank":
        UI.UIState.rankDraft = Math.min(Ranks.MAX_RANK, Math.max(1, Number(el.dataset.rank) || 1));
        Sfx.play("select");
        rerender();
        break;
      case "pick-starter":
        UI.UIState.starterDraft = Content.archetypes.byId[el.dataset.starter] ? el.dataset.starter : "standard";
        Sfx.play("select");
        rerender();
        break;
      case "choose-curse":
        Sfx.play("lose");
        dispatchAndRender({ type: "CHOOSE_CURSE", curseId: el.dataset.curse });
        UI.toast(state, "Проклятие забега принято. До конца забега.");
        rerender();
        break;
      case "fight": dispatchAndRender({ type: "CONFIRM_FIGHT" }); break;
      case "discard": Sfx.play("discard"); dispatchAndRender({ type: "DISCARD", uids: state.combat.selectedUids.slice() }); break;
      case "clear-selection": clearSelection(); break;
      case "enter-shop":
        Sfx.play("click");
        dispatchAndRender({ type: "ENTER_SHOP" });
        break;
      case "buy": Sfx.play("buy"); dispatchAndRender({ type: "BUY_ITEM", itemId: el.dataset.id }); break;
      case "buy-upgrade":
        Sfx.play("buy");
        dispatchAndRender({ type: "BUY_UPGRADE", upgradeId: el.dataset.id });
        break;
      case "reroll-upgrades":
        dispatchAndRender({ type: "REROLL_UPGRADES" });
        break;
      case "activate-upgrade": {
        Sfx.play("click");
        dispatchAndRender({ type: "ACTIVATE_UPGRADE", upgradeId: el.dataset.upgrade, targetId: el.dataset.target });
        if (state.run.pickDiscard) {
          UI.UIState.modal = "discard-pick";
          rerender();
        } else {
          const def = Content.upgrades.byId[el.dataset.upgrade];
          if (def) UI.toast(state, `${def.emoji} «${def.name}» активировано`);
        }
        break;
      }
      case "pick-discard":
        dispatchAndRender({ type: "PICK_DISCARD", uid: el.dataset.uid });
        UI.UIState.modal = null;
        break;
      case "retry-free":
        dispatchAndRender({ type: "RETRY_WAVE", useUpgradeId: el.dataset.upgrade });
        break;
      case "sell":
        dispatchAndRender({ type: "SELL_ITEM", itemId: el.dataset.id });
        if (UI.UIState.modal === "detail") UI.UIState.modal = null;
        UI.toast(state, "Предмет продан за половину цены");
        rerender();
        break;
      case "item-open":
        UI.UIState.modal = "detail";
        UI.UIState.detail = el.dataset.id;
        rerender();
        break;
      case "item-hint": UI.toast(state, "Новые предметы появятся в лавке после зачистки волны."); break;
      case "lock": dispatchAndRender({ type: "LOCK_OFFER", itemId: el.dataset.id }); break;
      case "reroll": dispatchAndRender({ type: "REROLL_SHOP" }); break;
      case "leave-shop": Sfx.play("click"); dispatchAndRender({ type: "LEAVE_SHOP" }); break;
      case "take-route":
        Sfx.play("path");
        dispatchAndRender({ type: "TAKE_ROUTE", kind: el.dataset.kind });
        break;
      case "buy-recruit":
        Sfx.play("buy");
        dispatchAndRender({ type: "BUY_RECRUIT", heroId: el.dataset.id });
        UI.toast(state, "Герой нанят — он в колоде");
        break;
      case "buy-augh": {
        Sfx.play("buy");
        const kindWord = el.dataset.kind === "scepter" ? "Скипетр Аганима" : "Осколок Аганима";
        dispatchAndRender({ type: "BUY_AUGMENT", heroId: el.dataset.hero, kind: el.dataset.kind });
        const aug = Content.aghanims.forHero(el.dataset.hero, el.dataset.kind);
        if (aug) UI.toast(state, `${kindWord} «${aug.name}» — ${Content.heroes.byId[el.dataset.hero].name}`);
        break;
      }
      case "exile":
        Sfx.play("discard");
        dispatchAndRender({ type: "EXILE_HERO", heroId: el.dataset.id });
        break;
      case "train":
        Sfx.play("buy");
        dispatchAndRender({ type: "TRAIN_HERO", heroId: el.dataset.id });
        break;
      case "change-attr":
        dispatchAndRender({ type: "CHANGE_ATTR", heroId: el.dataset.id, attr: el.dataset.attr });
        UI.toast(state, `${Content.heroes.byId[el.dataset.id].name}: атрибут — ${Content.attrNames[el.dataset.attr]}`);
        break;
      case "retry": dispatchAndRender({ type: "RETRY_WAVE" }); break;
      case "restart": {
        const input = document.getElementById("seed-input-modal");
        localStorage.removeItem(SAVE_KEY);
        closeModal();
        startRun(input ? input.value : "");
        UI.toast(state, "Новый забег начался. Удачи на линии!");
        break;
      }
      case "open-modal":
        UI.UIState.modal = el.dataset.modal;
        if (el.dataset.modal === "collection") UI.UIState.collectionTab = "heroes";
        // «Новый забег»: пикер ранга начинается с ранга текущего забега,
        // а не с дефолтного Рекрута.
        if (el.dataset.modal === "new" && state.phase !== "title" && state.run && state.run.rank) {
          UI.UIState.rankDraft = Math.min(Ranks.MAX_RANK, Math.max(1, state.run.rank));
        }
        rerender();
        break;
      case "open-collection":
        UI.UIState.modal = "collection";
        UI.UIState.collectionTab = "heroes";
        UI.UIState.search = "";
        rerender();
        break;
      case "open-collection-deck":
        UI.UIState.modal = "collection";
        UI.UIState.collectionTab = "deck";
        UI.UIState.labFocus = "exile";
        UI.UIState.search = "";
        rerender();
        break;
      case "score-view":
        UI.UIState.scoreView = el.dataset.view;
        rerender();
        break;
      case "open-training":
        UI.UIState.modal = "collection";
        UI.UIState.collectionTab = "deck";
        UI.UIState.labFocus = "train";
        UI.UIState.search = "";
        rerender();
        break;
      case "open-score":
        UI.UIState.modal = "score";
        rerender();
        break;
      case "collection-tab":
        UI.UIState.collectionTab = el.dataset.tab;
        UI.UIState.labFocus = null;
        UI.UIState.search = "";
        rerender();
        break;
      case "close-modal": closeModal(); break;
      case "modal-backdrop":
        if (e.target === el) {
          if (UI.UIState.onboarding) {
            UI.UIState.onboarding = false;
            try { localStorage.setItem(ONBOARD_KEY, "seen"); } catch (err) { /* ignore */ }
          }
          closeModal();
        }
        break;
      case "sort":
        UI.UIState.sort = UI.UIState.sort === el.dataset.mode ? "deal" : el.dataset.mode;
        rerender();
        break;
      case "nav-play": closeModal(); break;
      case "toggle-sound":
        Sfx.toggleMuted();
        savePrefs();
        rerender();
        break;
      case "toggle-motion":
        UI.UIState.motion = !UI.UIState.motion;
        savePrefs();
        rerender();
        break;
      case "toggle-journal":
        UI.UIState.journalOpen = !UI.UIState.journalOpen;
        rerender();
        break;
      case "show-tip":
        UI.toast(state, "Совет: " + UI.tipText(UI.UIState.tipIndex));
        UI.UIState.tipIndex = (UI.UIState.tipIndex + 1) % 6;
        break;
      case "close-toast": UI.UIState.toast = ""; rerender(); break;
      case "onboard-start":
        UI.UIState.onboarding = true;
        UI.UIState.onboardingStep = 0;
        rerender();
        break;
      case "onboard-next": UI.UIState.onboardingStep += 1; rerender(); break;
      case "onboard-prev": UI.UIState.onboardingStep = Math.max(0, UI.UIState.onboardingStep - 1); rerender(); break;
      case "onboard-close":
        UI.UIState.onboarding = false;
        try { localStorage.setItem(ONBOARD_KEY, "seen"); } catch (err) { /* ignore */ }
        rerender();
        break;
      case "debug-toggle": UI.UIState.debugOpen = !UI.UIState.debugOpen; rerender(); break;
      case "debug-gold": dispatchAndRender({ type: "DEBUG_GOLD" }); break;
      case "debug-fights": dispatchAndRender({ type: "DEBUG_FIGHTS" }); break;
      case "debug-tower": dispatchAndRender({ type: "DEBUG_DAMAGE_TOWER", amount: 100 }); break;
      case "debug-kill": dispatchAndRender({ type: "DEBUG_KILL_TOWER" }); break;
      case "debug-draw": dispatchAndRender({ type: "DEBUG_DRAW" }); break;
      case "debug-reveal": dispatchAndRender({ type: "DEBUG_REVEAL" }); break;
      default: break;
    }
  });

  // Live search inside collection modal (input event, not click).
  document.getElementById("app").addEventListener("input", (e) => {
    const el = e.target.closest("[data-action-input=search]");
    if (el) {
      UI.UIState.search = el.value;
      // re-render only the modal grid: cheap full render is fine
      rerender();
      const input = document.querySelector("[data-action-input=search]");
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLInputElement || e.target instanceof HTMLSelectElement) {
      if (e.key === "Enter" && e.target.id === "seed-input") {
        startRun(e.target.value);
      }
      if (e.key === "Enter" && e.target.id === "seed-input-modal") {
        startRun(e.target.value);
      }
      return;
    }
    if (e.key === "Escape") {
      if (UI.UIState.onboarding) { UI.UIState.onboarding = false; try { localStorage.setItem(ONBOARD_KEY, "seen"); } catch (err) { } }
      closeModal();
      if (!fighting) clearSelection();
      return;
    }
    if (UI.UIState.onboarding) {
      if (e.key === "Enter" || e.key === "ArrowRight") {
        UI.UIState.onboardingStep += 1;
        rerender();
      }
      if (e.key === "ArrowLeft") {
        UI.UIState.onboardingStep = Math.max(0, UI.UIState.onboardingStep - 1);
        rerender();
      }
      return;
    }
    if (UI.UIState.modal || fighting) return;
    if (/^[1-7]$/.test(e.key) && state.phase === "wave" && !state.combat.outcome) {
      e.preventDefault();
      const order = UI.handOrder(state);
      const uid = order[Number(e.key) - 1];
      if (uid) dispatchAndRender({ type: "SELECT_CARD", uid });
    }
    if (e.key === "Enter" && state.phase === "wave" && !state.combat.outcome) {
      e.preventDefault();
      if (state.combat.selectedUids.length) dispatchAndRender({ type: "CONFIRM_FIGHT" });
    }
    // Лавка: 1–5 купить предложение, R — реролл, Enter — следующая волна.
    if (state.phase === "shop") {
      if (/^[1-5]$/.test(e.key)) {
        const offer = (state.shop.offers || [])[Number(e.key) - 1];
        if (offer) {
          const item = Content.items.byId[offer.id];
          const cost = Game.itemCost(state, offer.id);
          if (state.run.gold >= cost) {
            Sfx.play("buy");
            dispatchAndRender({ type: "BUY_ITEM", itemId: offer.id });
          } else UI.toast(state, `Не хватает золота: «${item.name}» стоит ${cost}.`);
        }
      }
      if ((e.key.toLowerCase() === "r" || e.key.toLowerCase() === "к") && state.run.gold >= Game.rerollCost(state)) {
        dispatchAndRender({ type: "REROLL_SHOP" });
      }
      if (e.key === "Enter") {
        e.preventDefault();
        Sfx.play("click");
        dispatchAndRender({ type: "LEAVE_SHOP" });
      }
      return;
    }
    // Развилка: 1..N — выбор маршрута (опции лежат в стейте).
    if (state.phase === "route" && /^[1-9]$/.test(e.key)) {
      const opt = (state.combat.routeOptions || [])[Number(e.key) - 1];
      if (opt) {
        Sfx.play("path");
        dispatchAndRender({ type: "TAKE_ROUTE", kind: opt.id });
      }
    }
    if ((e.key.toLowerCase() === "r" || e.key.toLowerCase() === "к") && state.phase === "wave" && !state.combat.outcome) {
      if (state.combat.selectedUids.length && state.player.discardsLeft > 0) {
        e.preventDefault();
        dispatchAndRender({ type: "DISCARD", uids: state.combat.selectedUids.slice() });
        UI.toast(state, "Подкрепление прибыло. Собери новую комбинацию.");
      }
    }
    if (e.key.toLowerCase() === "d" && state.phase !== "title") {
      UI.UIState.debugOpen = !UI.UIState.debugOpen;
      rerender();
    }
  });

  rerender();

  // Debug handle for sandbox/testing (used by docs screenshots and console).
  window.__dalatro = {
    get state() { return state; },
    Game, Sim, Advisor, UI,
  };
})();

</script>
</body>
