  <script>
// Dalatro — game state + action dispatch.
// EVERYTHING that mutates state goes through dispatch(). UI never edits state,
// content never edits state: State -> Action -> Engine -> Events/Effects -> State.
const Game = (function () {
  const FIGHTS_PER_WAVE = 4;
  const DISCARDS_PER_WAVE = 3;
  const WAVE_CLEAR_GOLD = 6;
  const BARRACKS_MAX = 2; // жизни забега: одна ошибка — полколоды, вторая — конец
  const EXILE_COST = 4;
  const TRAIN_COST = 5;
  const TRAIN_RANK_MAX = 12;
  const DECK_MIN = 8;

  function createInitialState(seedCode) {
    return {
      seedCode: seedCode || "",
      phase: "title",
      run: { act: 1, waveIndex: 0, barracks: 2, gold: 4, momentum: 0, ranks: {}, campBoon: false },
      player: { deckUids: [], handUids: [], discardUids: [], items: [], fightsLeft: 0, discardsLeft: 0 },
      cards: {},
      combat: { wave: null, fightIndex: 0, selectedUids: [], outcome: null, lastResolution: null, scoring: null, minedUids: [], lastComboType: null, campTaken: false },
      shop: { offers: [], recruits: [] },
      log: [],
      stats: { totalDamage: 0, biggestHit: 0 },
      // Ядро скоринга: "classic" (покерные комбо) | "formation" (формации+связки+броня).
      rules: "classic",
      simulate: false,
    };
  }

  // Ранг героя с учётом тренировки в лаборатории колоды.
  function rankOf(state, heroId) {
    const overrides = state.run.ranks || {};
    return overrides[heroId] != null ? overrides[heroId] : Content.heroes.byId[heroId].power;
  }

  // Обезоруживание: проклятие элитки режет слоты до 4 (BKB снимает).
  function maxSlots(state) {
    const wave = state.combat.wave;
    if (wave && (wave.modifiers || []).some((m) => m.id === "disarm") && !state.player.items.includes("bkb")) {
      return 4;
    }
    return Combat.MAX_SLOTS;
  }

  function log(state, text) {
    state.log.push(text);
    if (state.log.length > 300) state.log.shift();
  }

  function setupWave(state, waveIndex, route) {
    const def = Content.waves.byId[Content.waves.order[waveIndex]];
    const elite = !!(route && route.elite) && !def.isBoss;
    const hp = elite ? Math.round(def.hp * 1.5) : def.hp;
    state.run.act = def.act || (Math.floor(waveIndex / 5) + 1);
    state.combat.wave = {
      towerId: def.id,
      name: def.name,
      emoji: def.emoji,
      isBoss: !!def.isBoss,
      miniBoss: !!def.miniBoss,
      elite,
      hp,
      maxHp: hp,
      modifiers: (def.modifiers || []).concat(elite && route.curse ? [{ id: route.curse }] : []).map((m) => ({ id: m.id })),
      enemyItems: [],
      aegisUsed: false,
    };
    state.combat.fightIndex = 0;
    state.combat.selectedUids = [];
    state.combat.outcome = null;
    state.combat.lastComboType = null;
    state.combat.campTaken = false;
    state.run.campBoon = false;
    state.combat.route = null;
    state.player.fightsLeft = FIGHTS_PER_WAVE;
    state.player.discardsLeft = DISCARDS_PER_WAVE;
    DeckSys.resetAll(state, Rng.current());
    DeckSys.draw(state, Rng.current());
    assignMines(state);
    log(state, elite
      ? `— Элитная волна (акт ${state.run.act}): ${def.name} — ${hp} HP (${Content.modifiers.byId[route.curse].name}!)`
      : `— Акт ${state.run.act}, волна ${waveIndex % 5 + 1}: ${def.name} — ${def.hp} HP`);
  }

  // Таверна: 2 рекрута из ещё не нанятых героев ростера.
  function pickRecruits(state) {
    const owned = new Set([...state.player.handUids, ...state.player.deckUids, ...state.player.discardUids].map((uid) => state.cards[uid].heroId));
    const pool = Content.heroes.list.filter((h) => !h.inDeck && !owned.has(h.id)).map((h) => h.id);
    const rng = Rng.current();
    const recruits = [];
    const copy = pool.slice();
    while (recruits.length < 2 && copy.length) {
      recruits.push(copy.splice(Math.floor(rng.next() * copy.length), 1)[0]);
    }
    return recruits;
  }

  function recruitPrice(heroId) {
    return 4 + Math.floor(Content.heroes.byId[heroId].power / 2);
  }

  function returnRapierIfHeld(state) {
    if (state.combat.wave.enemyItems.includes("rapier")) {
      state.combat.wave.enemyItems = state.combat.wave.enemyItems.filter((id) => id !== "rapier");
      state.player.items.push("rapier");
      log(state, "Divine Rapier возвращается к тебе!");
    }
  }

  // Мины Techies: на каждый бой минируются 2 случайные карты руки — их нельзя
  // разыграть. Sentry Ward / BKB обезвреживают. Перевыбирается на каждый бой
  // (после добора руки), сбрасывается, когда волна решена.
  function assignMines(state) {
    const wave = state.combat.wave;
    const hasMines = !!wave && (wave.modifiers || []).some((m) => m.id === "mines");
    const disarmed = state.player.items.includes("sentry") || state.player.items.includes("bkb");
    if (!hasMines || disarmed || state.combat.outcome || state.simulate) {
      state.combat.minedUids = [];
      return;
    }
    const pool = state.player.handUids.slice();
    const mines = [];
    while (mines.length < 2 && pool.length) {
      mines.push(pool.splice(Math.floor(Rng.current().next() * pool.length), 1)[0]);
    }
    state.combat.minedUids = mines;
  }

  function dispatch(state, action) {
    const s = state;
    switch (action.type) {
      case "START_RUN": {
        const code = Rng.normalizeSeedCode(action.seedCode) || Rng.randomSeedCode();
        const fresh = createInitialState(code);
        fresh.rules = action.rules === "formation" ? "formation" : "classic";
        fresh.phase = "wave";
        Rng.setActive(Rng.create(code));
        DeckSys.createFromHeroes(fresh, Content.heroes.startingIds);
        setupWave(fresh, 0);
        log(fresh, `Забег начат. Seed: DALATRO-${code}${fresh.rules === "formation" ? " · режим формаций" : ""}`);
        return fresh;
      }

      case "SELECT_CARD": {
        if (s.phase !== "wave" || s.combat.outcome) return s;
        const uid = action.uid;
        const idx = s.combat.selectedUids.indexOf(uid);
        if (idx !== -1) {
          s.combat.selectedUids.splice(idx, 1);
        } else if (
          s.combat.selectedUids.length < maxSlots(s) &&
          s.player.handUids.includes(uid) &&
          !(s.combat.minedUids || []).includes(uid)
        ) {
          s.combat.selectedUids.push(uid);
        }
        return s;
      }

      case "CONFIRM_FIGHT": {
        if (s.phase !== "wave" || s.combat.outcome || s.player.fightsLeft <= 0) return s;
        if (!s.combat.selectedUids.length || s.combat.selectedUids.length > maxSlots(s)) return s;
        const resolution = Combat.resolveFight(s);
        log(s, `Бой #${s.combat.fightIndex}: ${resolution.combo.name} → ${resolution.damage} урона`);
        if (resolution.killed) {
          s.combat.outcome = "cleared";
          s.run.momentum = Math.min((s.run.momentum || 0) + 1, Combat.MOMENTUM_CAP);
          s.combat.campTaken = false;
          const baseGold = s.combat.wave.gold || WAVE_CLEAR_GOLD;
          const clearGold = s.combat.wave.elite ? Math.round(baseGold * 1.5) : baseGold;
          s.run.gold += clearGold;
          log(s, `Волна зачищена! +${clearGold} золота${s.combat.wave.elite ? " (элитная добыча ×1.5)" : ""}. Импульс: ${s.run.momentum} волн подряд`);
          returnRapierIfHeld(s);
          if (s.combat.wave.isBoss) {
            if (s.run.waveIndex >= Content.waves.order.length - 1) {
              s.phase = "victory";
              log(s, "ТРОН ПАЛ. ТИ ВЗЯТ!");
            } else {
              // Акт пройден: премия за переход — золото и восстановление казармы.
              s.run.gold += 10;
              s.run.barracks = Math.min(BARRACKS_MAX, s.run.barracks + 1);
              log(s, `АКТ ${s.run.act} ПРОЙДЕН! +10 золота, +1 казарма (восстановление)`);
            }
          }
        } else if (s.player.fightsLeft <= 0) {
          s.combat.outcome = "failed";
        } else {
          assignMines(s); // рука добралась — свежие мины на следующий бой
        }
        return s;
      }

      case "DISCARD": {
        if (s.phase !== "wave" || s.combat.outcome || s.player.discardsLeft <= 0) return s;
        const uids = action.uids.filter((uid) => s.player.handUids.includes(uid));
        if (!uids.length) return s;
        for (const uid of uids) {
          const card = s.cards[uid];
          const hero = Content.heroes.byId[card.heroId];
          const fakeCard = { uid, heroId: card.heroId, power: hero.power, attr: hero.attr, illusion: false, slotIndex: 0 };
          const discardCtx = { returnToHand: false };
          const fakeResolution = { steps: [] };
          Triggers.runEvent(s, null, "ON_DISCARD", { playedCards: [fakeCard], onlyKinds: ["hero"], discardCtx }, fakeResolution);
          fakeResolution.steps.forEach((st) => log(s, st.label));
          if (!discardCtx.returnToHand) {
            DeckSys.moveToDiscard(s, [uid]);
          }
        }
        s.player.discardsLeft -= 1;
        DeckSys.draw(s, Rng.current());
        assignMines(s);
        return s;
      }

      case "ENTER_SHOP": {
        if (s.phase !== "wave" || s.combat.outcome !== "cleared") return s;
        s.phase = "shop";
        s.shop.offers = Economy.generateOffers(s, Economy.OFFER_SLOTS, [], s.combat.wave.elite);
        s.shop.recruits = pickRecruits(s);
        return s;
      }

      case "BUY_ITEM": {
        if (s.phase !== "shop") return s;
        const item = Content.items.byId[action.itemId];
        const offerIdx = s.shop.offers.findIndex((o) => o.id === action.itemId);
        if (!item || offerIdx === -1) return s;
        if (s.player.items.includes(action.itemId)) return s;
        if (s.run.gold < item.cost) return s;
        s.run.gold -= item.cost;
        s.player.items.push(action.itemId);
        s.shop.offers.splice(offerIdx, 1);
        log(s, `Куплено: ${item.name} (−${item.cost} золота)`);
        return s;
      }

      case "LOCK_OFFER": {
        if (s.phase !== "shop") return s;
        const offer = s.shop.offers.find((o) => o.id === action.itemId);
        if (!offer) return s;
        offer.locked = !offer.locked;
        return s;
      }

      case "SELL_ITEM": {
        if (s.phase !== "shop") return s;
        const idx = s.player.items.indexOf(action.itemId);
        if (idx === -1) return s;
        const item = Content.items.byId[action.itemId];
        const value = Economy.sellValue(action.itemId);
        s.player.items.splice(idx, 1);
        s.run.gold += value;
        log(s, `Продано: ${item.name} (+${value} золота)`);
        return s;
      }

      case "REROLL_SHOP": {
        if (s.phase !== "shop" || s.run.gold < Economy.REROLL_COST) return s;
        s.run.gold -= Economy.REROLL_COST;
        const locked = s.shop.offers.filter((o) => o.locked);
        s.shop.offers = Economy.generateOffers(s, Economy.OFFER_SLOTS, locked);
        s.shop.recruits = pickRecruits(s);
        return s;
      }

      case "LEAVE_SHOP": {
        if (s.phase !== "shop") return s;
        const nextIndex = s.run.waveIndex + 1;
        const nextDef = Content.waves.byId[Content.waves.order[nextIndex]];
        if (!nextDef) return s;
        if (nextDef.isBoss) {
          // перед боссом развилки нет — только его башня
          s.phase = "wave";
          s.run.waveIndex = nextIndex;
          setupWave(s, nextIndex, null);
          return s;
        }
        const rng = Rng.current();
        const curse = Content.curses[Math.floor(rng.next() * Content.curses.length)];
        s.combat.route = { curse };
        s.phase = "route";
        return s;
      }

      case "TAKE_ROUTE": {
        if (s.phase !== "route" || !s.combat.route) return s;
        const nextIndex = s.run.waveIndex + 1;
        if (action.kind === "camp") {
          if (s.combat.campTaken) return s;
          s.run.gold += 6;
          s.run.barracks = Math.min(BARRACKS_MAX, s.run.barracks + 1);
          s.run.campBoon = true;
          s.combat.campTaken = true;
          s.combat.route = null;
          s.phase = "shop";
          log(s, "Крип-лагерь зачищен без боя: +6 золота, привал (+1 казарма), бесплатное увольнение в лавке");
          return s;
        }
        s.phase = "wave";
        s.run.waveIndex = nextIndex;
        setupWave(s, nextIndex, action.kind === "elite" ? { elite: true, curse: s.combat.route.curse } : null);
        return s;
      }

      case "BUY_RECRUIT": {
        if (s.phase !== "shop") return s;
        const heroId = action.heroId;
        if (!s.shop.recruits || !s.shop.recruits.includes(heroId)) return s;
        const price = recruitPrice(heroId);
        if (s.run.gold < price) return s;
        s.run.gold -= price;
        s.shop.recruits = s.shop.recruits.filter((id) => id !== heroId);
        DeckSys.addHero(s, heroId);
        log(s, `${Content.heroes.byId[heroId].name} нанят в таверне (−${price} золота)`);
        return s;
      }

      case "EXILE_HERO": {
        if (s.phase !== "shop") return s;
        const heroId = action.heroId;
        const free = !!s.run.campBoon;
        if (!free && s.run.gold < EXILE_COST) return s;
        const total = s.player.handUids.length + s.player.deckUids.length + s.player.discardUids.length;
        if (total <= DECK_MIN) return s;
        const piles = [s.player.handUids, s.player.deckUids, s.player.discardUids];
        let removed = false;
        for (const pile of piles) {
          const idx = pile.findIndex((uid) => s.cards[uid].heroId === heroId);
          if (idx !== -1) {
            delete s.cards[pile[idx]];
            pile.splice(idx, 1);
            removed = true;
            break;
          }
        }
        if (!removed) return s;
        s.combat.selectedUids = s.combat.selectedUids.filter((uid) => s.cards[uid]);
        if (!free) s.run.gold -= EXILE_COST;
        s.run.campBoon = false;
        log(s, `${Content.heroes.byId[heroId].name} покинул колоду${free ? " (бесплатно — привал крип-лагеря)" : ` (−${EXILE_COST} золота)`}`);
        return s;
      }

      case "TRAIN_HERO": {
        if (s.phase !== "shop") return s;
        const heroId = action.heroId;
        const owned = [...s.player.handUids, ...s.player.deckUids, ...s.player.discardUids]
          .some((uid) => s.cards[uid].heroId === heroId);
        if (!owned || s.run.gold < TRAIN_COST) return s;
        const current = rankOf(s, heroId);
        if (current >= TRAIN_RANK_MAX) return s;
        s.run.gold -= TRAIN_COST;
        s.run.ranks = s.run.ranks || {};
        s.run.ranks[heroId] = current + 1;
        log(s, `Тренировка: ${Content.heroes.byId[heroId].name} → ранг ${current + 1}`);
        return s;
      }

      case "RETRY_WAVE": {
        if (s.phase !== "wave" || s.combat.outcome !== "failed") return s;
        s.run.barracks -= 1;
        if ((s.run.momentum || 0) > 0) log(s, "Импульс сброшен: серия волн прервана.");
        s.run.momentum = 0;
        log(s, `Казарма потеряна! Осталось: ${s.run.barracks}`);
        if (s.run.barracks <= 0) {
          s.phase = "gameover";
          log(s, "Трон разрушен. Забег окончен.");
          return s;
        }
        if (s.player.items.includes("rapier")) {
          s.player.items = s.player.items.filter((id) => id !== "rapier");
          s.combat.wave.enemyItems.push("rapier");
          log(s, "Divine Rapier у врага! Твой урон по этой башне ×0.5, пока он её держит.");
        }
        s.combat.wave.hp = s.combat.wave.maxHp;
        s.combat.fightIndex = 0;
        s.combat.outcome = null;
        s.player.fightsLeft = FIGHTS_PER_WAVE;
        s.player.discardsLeft = DISCARDS_PER_WAVE;
        DeckSys.resetAll(s, Rng.current());
        DeckSys.draw(s, Rng.current());
        assignMines(s);
        return s;
      }

      case "DEBUG_GOLD":
        s.run.gold += 1000;
        return s;
      case "DEBUG_FIGHTS":
        s.player.fightsLeft += 5;
        return s;
      case "DEBUG_DAMAGE_TOWER":
        s.combat.wave.hp = Math.max(0, s.combat.wave.hp - (action.amount || 100));
        return s;
      case "DEBUG_KILL_TOWER":
        s.combat.wave.hp = 0;
        return s;
      case "DEBUG_DRAW":
        DeckSys.draw(s, Rng.current());
        return s;
      case "DEBUG_REVEAL":
        s.debugReveal = !s.debugReveal;
        return s;

      default:
        console.warn("Unknown action:", action.type);
        return s;
    }
  }

  return {
    createInitialState, dispatch,
    FIGHTS_PER_WAVE, DISCARDS_PER_WAVE, WAVE_CLEAR_GOLD, BARRACKS_MAX,
    EXILE_COST, TRAIN_COST, TRAIN_RANK_MAX, DECK_MIN,
    assignMines, rankOf, maxSlots, recruitPrice,
  };
})();

// No separate preview logic, ever. RNG is suppressed so a preview never
// consumes draws or rolls from the real run.
const Sim = (function () {

    try {
      clone = structuredClone(state);
    } catch (e) {
      console.error("[simulate] clone failed", e);
      return null;
    }
    clone.simulate = true;
    return Rng.suppress(() => {
      try {
        return Game.dispatch(clone, action);

  <script>
// Dalatro — poker module. Knows nothing about Dota: takes cards with
// { power, attr } and returns the best combination contained in the set.
// All played cards still contribute their power; the combo only sets the type
// and its base power / multiplier.
const PokerSys = (function () {
  // Detection rank: wild ranks (Butterfly) and illusions (Manta) override it
  // via detectPower, while their real `power` still drives the damage sum.
  function valueOf(card) {
    return card.detectPower != null ? card.detectPower : card.power;
  }

  function countsBy(cards, key) {
    const map = new Map();
    for (const c of cards) {
      const k = key === "power" ? valueOf(c) : c[key];
      map.set(k, (map.get(k) || 0) + 1);
    }
    return map;
  }

  function hasStraight(values) {
    const distinct = Array.from(new Set(values)).sort((a, b) => a - b);
    let run = 1;
    for (let i = 1; i < distinct.length; i++) {
      run = distinct[i] === distinct[i - 1] + 1 ? run + 1 : 1;
      if (run >= 5) return true;
    }
    return false;
  }

  // Returns { type } — best combo contained in the card set (1..6 cards).
  function detectType(cards) {
    if (!cards || cards.length === 0) return null;

    const powers = countsBy(cards, "power");
    const attrs = countsBy(cards, "attr");
    const values = cards.map(valueOf);

    const hasFlush = cards.length >= 5 && Array.from(attrs.values()).some((n) => n >= 5);
    const straightOk = cards.length >= 5 && hasStraight(values);

    const hasTriple = Array.from(powers.values()).some((n) => n >= 3);
    const pairValues = Array.from(powers.values()).filter((n) => n >= 2).length;

    if (hasFlush && straightOk) return "straight_flush"; // not in slice table; falls back below
    if (hasFlush) return "flush";
    if (straightOk) return "straight";
    if (hasTriple && pairValues >= 2) return "full_house";
    if (hasTriple) return "three";
    if (pairValues >= 2) return "two_pair";
    if (pairValues >= 1) return "pair";
    return "high_card";
  }

  // Best combo for the effective card set, honoring the slice combo table.
  // straight_flush scores as flush for now (expansion point, see ROADMAP).
  function evaluate(cards) {
    let type = detectType(cards);
    if (type === "straight_flush") type = "flush";
    if (!type) return null;
    const def = Content.combos.byId[type];
    if (!def) return null;
    return { type, name: def.name, basePower: def.basePower, baseMult: def.baseMult };
  }

  return { evaluate, detectType };
})();

  <script>
// FormationSys — альтернативное ядро скоринга (state.rules = "formation").
// Тот же контракт evaluate(cards), что у PokerSys, но детекция читает ПОРЯДОК
// слотов через detectPower-ранги, а формация выбирается по максимальному
// ИТОГОВОМУ урону, а не по приоритету тира. Все правила — данные из
// content/world.js (FORMATIONS_DATA / BONDS_DATA / TOWER_DEFENSE).
//
// Правило выбора (docs/REDESIGN_ANTI_BALATRO.md §12):
//   1. найти все валидные формации;
//   2. для каждой посчитать полный ожидаемый результат — итоговый урон
//      (связки + Σ сил карт + тип урона + защита цели);
//   3. выбрать максимум;
//   4. ничья — предпочесть позиционную формацию (порядок требует навыка).
//
// Контракт совместим с боевым пайплайном:
//   evaluate(cards, opts?) -> { id, name, tier, basePower, baseMult,
//                               damageType, damage, bonds[], alternatives[] }
// где cards = [{ power, attr, detectPower?, slotIndex }] в порядке слотов, а
// opts = { defense: {armor, mr}, armorPen, commit } — контекст цели и ставка.
const FormationSys = (function () {
  // Ранг для детекции — паритет с poker.js valueOf: Butterfly/Manta/Shadow
  // Blade меняют только его; реальная сила карт в Σ сил считает combat.
  function valueOf(card) {
    return card.detectPower != null ? card.detectPower : card.power;
  }

  function buildCtx(cards) {
    const bySlot = cards.slice().sort((a, b) => a.slotIndex - b.slotIndex);
    const powers = bySlot.map(valueOf);
    const attrs = bySlot.map((c) => c.attr);
    const counts = (arr) => {
      const m = new Map();
      for (const v of arr) m.set(v, (m.get(v) || 0) + 1);
      return m;
    };
    return {
      cards: bySlot,
      playedCards: bySlot,
      powers,
      attrs,
      attrCounts: counts(attrs),
      rankCounts: counts(powers),
      // Σ РЕАЛЬНЫХ сил (не detectPower) — combat.js добавляет её к базе на шаге 3.
      // Нужна здесь, потому что «полный ожидаемый результат» для выбора формации
      // обязан включать её: броня вычитается плоско, и константа меняет рейтинг.
      cardPower: bySlot.reduce((a, c) => a + (c.power || 0), 0),
      n: bySlot.length,
      maxPower: Math.max(...powers),
      minPower: Math.min(...powers),
    };
  }

  // Наибольшая длина подряд идущих рангов (для «Цепочки» и «Тимвайпа»).
  function longestRun(ctx) {
    const distinct = Array.from(new Set(ctx.powers)).sort((a, b) => a - b);
    let best = 1, run = 1;
    for (let i = 1; i < distinct.length; i++) {
      run = distinct[i] === distinct[i - 1] + 1 ? run + 1 : 1;
      if (run > best) best = run;
    }
    return distinct.length ? best : 0;
  }

  function ascending(ctx) {
    for (let i = 1; i < ctx.powers.length; i++) if (ctx.powers[i] <= ctx.powers[i - 1]) return false;
    return ctx.powers.length >= 3;
  }

  // Сильнейший герой стоит В ЦЕНТРЕ формации: для нечётного n — средний слот,
  // для чётного — один из двух средних.
  function peakInCenter(ctx) {
    if (ctx.n < 3) return false;
    const idx = ctx.powers.indexOf(ctx.maxPower);
    const mid = Math.floor((ctx.n - 1) / 2);
    return ctx.n % 2 === 1 ? idx === mid : idx === mid || idx === mid + 1;
  }

  // Кэрри в центре и заметно выше остальных — «4 protect 1».
  function carryProtected(ctx, margin) {
    if (ctx.n < 5) return false;
    const center = Math.floor(ctx.n / 2);
    const carry = ctx.powers[center];
    if (carry !== ctx.maxPower) return false;
    const others = ctx.powers.filter((_, i) => i !== center);
    const avgOthers = others.reduce((a, b) => a + b, 0) / others.length;
    return carry >= avgOthers + margin;
  }

  function frontIs(ctx, attr, minPower) {
    const front = ctx.cards.slice(0, 2);
    return front.length === 2 && front.every((c) => valueOf(c) >= minPower && c.attr === attr);
  }

  function backIs(ctx, attr, minPower) {
    const back = ctx.cards.slice(-2);
    return ctx.n >= 4 && back.every((c) => valueOf(c) >= minPower && c.attr === attr);
  }

  // Собственный eval-слой условий: новые типы читают ctx формации,
  // остальные отдаём существующему Cond (ctx.playedCards уже подставлен).
  function evalWhen(when, ctx) {
    if (!when) return true;
    if (when.all) return when.all.every((w) => evalWhen(w, ctx));
    if (when.any) return when.any.some((w) => evalWhen(w, ctx));
    if (when.not) return !evalWhen(when.not, ctx);

    switch (when.type) {
      case "PLAYED_COUNT_IS": return ctx.n === when.value;
      case "PLAYED_COUNT_ABOVE": return ctx.n > when.value;
      case "PLAYED_COUNT_BELOW": return ctx.n < when.value;
      case "DISTINCT_ATTRIBUTES_ABOVE": return new Set(ctx.attrs).size > when.value;
      case "SAME_ATTRIBUTE_COUNT_ABOVE":
        return Array.from(ctx.attrCounts.values()).some((n) => n > when.value);
      case "FRONT_IS": return frontIs(ctx, when.attr, when.minPower || 0);
      case "BACK_IS": return backIs(ctx, when.attr, when.minPower || 0);
      case "PEAK_IN_CENTER": return peakInCenter(ctx);
      case "RANKS_ASCENDING": return ascending(ctx);
      case "RANK_RUN": return longestRun(ctx) >= when.value;
      case "CARRY_PROTECTED": return carryProtected(ctx, when.margin || 0);
      case "COUNT_ATTR": return (ctx.attrCounts.get(when.attr) || 0) >= when.min;
      case "SAME_RANK_GROUP": return Array.from(ctx.rankCounts.values()).some((n) => n >= when.size);
      case "ALL_RANKS_DISTINCT":
        return ctx.n >= when.min && new Set(ctx.powers).size === ctx.n;
      default:
        // Делегируем в боевой Cond (COMBO_IS и пр. там уже умеют работать).
        if (typeof Cond !== "undefined") return Cond.evaluate(when, { playedCards: ctx.cards, card: null, slotIndex: -1 });
        return false;
    }
  }

  function resolveDamageType(def, ctx) {
    if (def.damageType !== "byAttribute") return def.damageType;
    const dominant = Array.from(ctx.attrCounts.entries()).sort((a, b) => b[1] - a[1])[0];
    return { str: "physical", agi: "physical", int: "magical", uni: "pure" }[dominant[0]] || "physical";
  }

  // Все активные связки (в отличие от формации — складываются все).
  function computeBonds(ctx) {
    const active = [];
    for (const bond of BONDS_DATA) {
      if (evalWhen(bond.when, ctx)) active.push(bond);
    }
    return active;
  }

  // Броня/сопротивление: третья ось. pure игнорирует защиту.
  function mitigate(rawDamage, damageType, defense, armorPen) {
    const pen = armorPen || 0;
    if (damageType === "pure") return Math.max(1, Math.round(rawDamage));
    if (damageType === "magical") {
      const mr = Math.max(0, (defense.mr || 0) - pen / 200);
      return Math.max(1, Math.round(rawDamage * (1 - mr)));
    }
    // Плоская броня, но не больше половины удара: мелкая рука не обнуляется.
    const armor = Math.max(0, (defense.armor || 0) - pen);
    const absorbed = Math.min(armor, rawDamage * 0.5);
    return Math.max(1, Math.round(rawDamage - absorbed));
  }

  // Строгий порядок «кто лучше»: урон → позиционность → база.
  function better(a, b) {
    if (a.damage !== b.damage) return a.damage > b.damage;
    if (!!a.positional !== !!b.positional) return !!a.positional;
    return a.basePower * a.baseMult > b.basePower * b.baseMult;
  }

  function scoreFormation(def, ctx, opts) {
    const bonds = computeBonds(ctx);
    const bondPower = bonds.reduce((a, b) => a + (b.power || 0), 0);
    const bondMult = bonds.reduce((a, b) => a + (b.mult || 0), 0);
    const basePower = def.basePower + bondPower;
    const baseMult = def.baseMult + bondMult;
    const damageType = resolveDamageType(def, ctx);
    // «Полный ожидаемый результат»: база + связки + Σ сил карт (реальных),
    // ставка (finalMult) до защиты — как в combat.js (шаги 3 → 6.5 → 7 → 8).
    // basePower в ответе остаётся БЕЗ Σ — её добавит combat (контракт PokerSys).
    const raw = (basePower + ctx.cardPower) * baseMult * (opts.commit || 1);
    const damage = opts.defense ? mitigate(raw, damageType, opts.defense, opts.armorPen) : raw;
    return { def, bonds, bondPower, bondMult, basePower, baseMult, damageType, raw, damage };
  }

  // Все валидные формации, отсортированные по итоговому урону.
  // Это данные для панели альтернатив: «Клин 347 / Фаланга 284 / Рампа 251».
  function rankFormations(cards, opts = {}) {
    const withSlots = cards.map((c, i) => ({ ...c, slotIndex: c.slotIndex != null ? c.slotIndex : i }));
    const ctx = buildCtx(withSlots);
    const list = [];
    for (const def of FORMATIONS_DATA) {
      if (!evalWhen(def.when, ctx)) continue;
      const s = scoreFormation(def, ctx, opts);
      list.push({
        id: s.def.id, name: s.def.name, tier: s.def.tier, rule: s.def.rule,
        positional: !!s.def.positional, damageType: s.damageType,
        formPower: s.def.basePower, formMult: s.def.baseMult,
        basePower: s.basePower, baseMult: s.baseMult,
        bonds: s.bonds, bondPower: s.bondPower, bondMult: s.bondMult,
        raw: s.raw, damage: s.damage,
      });
    }
    list.sort((a, b) => (better(a, b) ? -1 : better(b, a) ? 1 : 0));
    return { ctx, list };
  }

  function evaluate(cards, opts = {}) {
    if (!cards || !cards.length) return null;
    const { list } = rankFormations(cards, opts);
    if (!list.length) return null;
    const best = list[0];
    return {
      // Совместимость со старым контрактом PokerSys.
      type: best.id, name: best.name, basePower: best.basePower, baseMult: best.baseMult,
      // Новый слой.
      id: best.id, tier: best.tier, rule: best.rule, positional: best.positional,
      damageType: best.damageType, raw: best.raw, damage: best.damage,
      formPower: best.formPower, formMult: best.formMult,
      bonds: best.bonds, bondPower: best.bondPower, bondMult: best.bondMult,
      alternatives: list,
    };
  }

  // Подсказка перестановки: обмен двух слотов, дающий лучший итоговый урон.
  // Это и есть gameplay loop v2: «переставь Sven в центр → Клин 150 (+17)».
  // Возвращает { swap: [i, j], id, name, damage, gain } или null.
  function bestSwap(cards, opts = {}) {
    if (!cards || cards.length < 2) return null;
    const base = evaluate(cards, opts);
    if (!base) return null;
    // Позиции нормализуем сами: вызывающий может передать карты без slotIndex.
    const positioned = cards.map((c, i) => ({ ...c, slotIndex: c.slotIndex != null ? c.slotIndex : i }));
    let best = null;
    for (let i = 0; i < positioned.length; i++) {
      for (let j = i + 1; j < positioned.length; j++) {
        const swapped = positioned.map((c) => ({ ...c }));
        const ti = swapped[i].slotIndex, tj = swapped[j].slotIndex;
        swapped[i].slotIndex = tj;
        swapped[j].slotIndex = ti;
        const r = evaluate(swapped, opts);
        if (r && r.damage > (best ? best.damage : base.damage)) {
          best = { swap: [i, j], id: r.id, name: r.name, damage: r.damage };
        }
      }
    }
    if (!best || best.damage <= base.damage) return null;
    best.gain = best.damage - base.damage;
    return best;
  }

  return { evaluate, rankFormations, bestSwap, mitigate, computeBonds, buildCtx, evalWhen, better, longestRun };
})();

// Dalatro — deck system: deck / hand / discard as uid arrays + card registry.
const DeckSys = (function () {
  let uidCounter = 0;
  // Hand of 7 vs deck of 12: after playing 5 the refill exactly drains the deck,
  // so played heroes return only on the next full cycle (no full-house spam).
  const HAND_SIZE = 7;

  // state.cards: uid -> { uid, heroId }. Deck arrays hold uids only.
  function createFromHeroes(state, heroIds) {
    state.cards = {};
    state.player.deckUids = [];
    for (const heroId of heroIds) {
      const uid = "c" + uidCounter++;
      state.cards[uid] = { uid, heroId };
      state.player.deckUids.push(uid);
    }
    state.player.handUids = [];
    state.player.discardUids = [];
  }

  // Draws until the hand reaches HAND_SIZE (or deck+discard are empty).
  function draw(state, rng) {
    while (state.player.handUids.length < HAND_SIZE) {
      if (state.player.deckUids.length === 0) {
        if (state.player.discardUids.length === 0) return;
        state.player.deckUids = rng.shuffle(state.player.discardUids.slice());
        state.player.discardUids = [];
      }
      state.player.handUids.push(state.player.deckUids.pop());
    }
  }

  function moveToDiscard(state, uids) {
    for (const uid of uids) {
      const idx = state.player.handUids.indexOf(uid);
      if (idx !== -1) {
        state.player.handUids.splice(idx, 1);
        state.player.discardUids.push(uid);
      }
    }
  }

  function resetAll(state, rng) {
    const all = state.player.deckUids
      .concat(state.player.handUids)
      .concat(state.player.discardUids);
    state.player.deckUids = rng.shuffle(all.slice());
    state.player.handUids = [];
    state.player.discardUids = [];
  }

  // Creates a card for a recruited hero and adds it to the deck (tavern).
  function addHero(state, heroId) {
    const uid = "c" + uidCounter++;
    state.cards[uid] = { uid, heroId };
    state.player.deckUids.push(uid);
    return uid;
  }

  return { createFromHeroes, draw, moveToDiscard, resetAll, addHero, HAND_SIZE };
})();

  <script>
// Dalatro — combat orchestration. The heart of the vertical slice.
//
// Resolution order (fixed, documented in ARCHITECTURE.md):
//   1. PRE_DETECT   — heroes (slot order) + items mutate what the detector sees
//                     (Morphling copy, Manta illusion, Butterfly wild rank)
//   2. Detection    — poker.evaluate on the effective set
//   3. Base         — combo base power + sum of effective card powers
//   4. Hero triggers (slot order): ON_PLAY then COMBO_DETECTED
//   5. Item triggers (acquisition order): FIGHT_SCORING
//   6. Refresher    — hero triggers (4) run a second time
//   6.5 Commitment  — ставка карт: ×1.1 (4 героя) / ×1.25 (5 героев)
//   6.6 Momentum    — серия зачищенных волн: ×1.05 за каждую
//   7. Tower mods   — BKB / Butterfly interact, then armor / glyph
//   8. Damage       — power × mult × finalMult × towerMult
//   9. Death/Aegis  — revive once, else killed
//  10. Gold         — overkill (decayed) + exact last hit
const Combat = (function () {
  const HAND_SIZE = DeckSys.HAND_SIZE;
  const MAX_SLOTS = 5;

  // Ставка: сколько героев отправил в бой. 2-3 героя — нейтрально.
  const COMMIT_TIERS = {
    1: { name: "Харас", finalMult: 1, gold: 1 },
    4: { name: "Тимфайт", finalMult: 1.1, gold: 0 },
    5: { name: "Коммит", finalMult: 1.25, gold: 0 },
  };
  // Импульс: серия зачищенных волн подряд (сбрасывается провалом).
  const MOMENTUM_STEP = 0.05;
  const MOMENTUM_CAP = 10;

  function realPlayedCards(state) {
    return state.combat.selectedUids.map((uid) => {
      const card = state.cards[uid];
      return { uid, heroId: card.heroId, power: Game.rankOf(state, card.heroId), attr: heroAttr(state, card.heroId), illusion: false, slotIndex: 0 };
    });
  }

  // Ранг с учётом тренировки (state.run.ranks) и проклятие-список волны.
  function heroAttr(state, heroId) {
    return Content.heroes.byId[heroId].attr;
  }

  function waveCurses(state) {
    const wave = state.combat.wave;
    if (!wave) return [];
    return (wave.modifiers || [])
      .map((m) => m.id)
      .filter((id) => Content.modifiers.byId[id] && Content.modifiers.byId[id].curse);
  }

  function collectPreDetectEffects(state, playedCards) {
    const effects = [];
    playedCards.forEach((card, slotIndex) => {
      if (card.illusion) return;
      const hero = Content.heroes.byId[card.heroId];
      if (hero.ability && hero.ability.event === "PRE_DETECT") {
        effects.push({ effect: hero.ability.effects[0], card, slotIndex, sourceName: hero.name });
      }
    });
    state.player.items.forEach((itemId) => {
      const item = Content.items.byId[itemId];
      if (item.ability && item.ability.event === "PRE_DETECT") {
        effects.push({ effect: item.ability.effects[0], card: null, slotIndex: -1, sourceName: item.name });
      }
    });
    return effects;
  }

  // Builds the effective card set (scoring) and the detection view (combo).
  function buildEffectiveSet(state, playedCards, resolution) {
    const effective = playedCards.map((c) => ({ ...c }));
    const pendingIllusions = [];
    const pendingWilds = [];
    const copyLog = []; // какие копии атрибута изменили effective-набор
    let strongestBump = 0;
    let bumpSource = null;

    for (const { effect, card, slotIndex, sourceName } of collectPreDetectEffects(state, effective)) {
      switch (effect.type) {
        case "COPY_ATTRIBUTE": {
          const right = effect.target === "right_neighbor";
          const neighbor = right
            ? (slotIndex < effective.length - 1 ? effective[slotIndex + 1] : null)
            : (slotIndex > 0 ? effective[slotIndex - 1] : null);
          if (neighbor && neighbor.attr !== effective[slotIndex].attr) {
              Resolver.pushStep(resolution, {
                icon: "✦",
                label: `${sourceName} копирует атрибут «${Content.attrNames[neighbor.attr]}» у ${Content.heroes.byId[neighbor.heroId].name}`,
                kind: "hero",
              });
              copyLog.push({
                uid: effective[slotIndex].uid,
                heroId: effective[slotIndex].heroId,
                from: effective[slotIndex].attr,
                to: neighbor.attr,
              });
              effective[slotIndex].attr = neighbor.attr;
            }
          break;
        }
        case "CREATE_ILLUSION": {
          const strongest = effective.reduce((a, b) => (b.power > a.power ? b : a), effective[0]);
          if (strongest) {
            pendingIllusions.push({ sourceName, of: strongest, ratio: effect.powerRatio || 0.5 });
          }
          break;
        }
        case "WILD_RANK": {
          pendingWilds.push({ sourceName });
          break;
        }
        case "BUMP_STRONGEST_RANK": {
          strongestBump += effect.value || 1;
          bumpSource = sourceName;
          break;
        }
      }
    }

    // Illusions join the effective set (half power, count for combos, never trigger).
    for (const { sourceName, of, ratio } of pendingIllusions) {
      const illusionPower = Math.floor(of.power * ratio);
      effective.push({
        uid: "illusion_" + of.uid,
        heroId: of.heroId,
        power: illusionPower,
        detectPower: of.detectPower != null ? of.detectPower : of.power,
        attr: of.attr,
        illusion: true,
      });
      Resolver.pushStep(resolution, {
        icon: "◆",
        label: `${sourceName}: иллюзия ${Content.heroes.byId[of.heroId].name} (${illusionPower} силы) вступает в бой`,
        kind: "item",
      });
    }

    // Wild ranks and rank bumps affect detection only — real power still scores.
    // Candidates: identity, +bumped-strongest, each ± butterfly wild on the
    // weakest card. The engine plays whichever candidate yields the best combo,
    // so detection hooks never HURT the player.
    const identity = effective.map((c) => ({ ...c, meta: { bumped: false, wild: 0 } }));
    const candidates = [identity];
    if (strongestBump) {
      const strongestIdx = identity.reduce((mi, c, i, arr) => (c.power > arr[mi].power ? i : mi), 0);
      for (const delta of [strongestBump, -strongestBump]) {
        const bumped = effective.map((c) => ({ ...c, meta: { bumped: true, wild: 0 } }));
        bumped[strongestIdx].detectPower =
          (bumped[strongestIdx].detectPower != null ? bumped[strongestIdx].detectPower : bumped[strongestIdx].power) + delta;
        candidates.push(bumped);
      }
    }
    if (pendingWilds.length) {
      for (const base of candidates.slice()) {
        const weakestIdx = base.reduce((mi, c, i, arr) => (c.power < arr[mi].power ? i : mi), 0);
        for (const delta of [-1, 1]) {
          const variant = base.map((c) => ({ ...c, meta: { ...c.meta } }));
          variant[weakestIdx] = { ...variant[weakestIdx], detectPower: variant[weakestIdx].power + delta, meta: { bumped: variant[weakestIdx].meta.bumped, wild: delta } };
          candidates.push(variant);
        }
      }
    }
    let best = null;
    const formationMode = state.rules === "formation";
    for (const candidate of candidates) {
      const combo = formationMode
        ? FormationSys.evaluate(candidate, { defense: towerDefenseOf(state) })
        : PokerSys.evaluate(candidate);
      if (!combo) continue;
      if (!best || (formationMode ? betterFormation(combo, best.combo) : betterCombo(combo, best.combo))) {
        best = { combo, cards: candidate, meta: candidate[0].meta };
      }
    }
    const usedBump = best.meta && best.meta.bumped;
    if (strongestBump && usedBump) {
      Resolver.pushStep(resolution, {
        icon: "◆",
        label: `${bumpSource}: сильнейшая карта считается соседним рангом`,
        kind: "item",
      });
    }
    if (pendingWilds.length && best.meta && best.meta.wild !== 0) {
      Resolver.pushStep(resolution, {
        icon: "◆",
        label: `Butterfly: слабейшая карта считается соседним рангом для комбо`,
        kind: "item",
      });
    }
    return { effective, combo: best.combo, copyLog };
  }

  function betterCombo(a, b) {
    const ra = Content.combos.byId[a.type].rank;
    const rb = Content.combos.byId[b.type].rank;
    if (ra !== rb) return ra > rb;
    return a.basePower > b.basePower;
  }

  // Формации: кандидат детекции выбирается по итоговому урону против башни
  // (docs/REDESIGN_ANTI_BALATRO.md §12), ничья — позиционность/тир.
  function betterFormation(a, b) {
    if (a.damage !== b.damage) return a.damage > b.damage;
    if (a.tier !== b.tier) return a.tier > b.tier;
    return a.basePower * a.baseMult > b.basePower * b.baseMult;
  }

  // Числовая защита цели (formation): TOWER_DEFENSE по id башни. BKB обнуляет —
  // он и так выключает волновые модификаторы и проклятия.
  function towerDefenseOf(state) {
    if (state.combat.scoring && state.combat.scoring.flags.bkbBlocksMods) return { armor: 0, mr: 0 };
    return Content.towerDefense.byId[state.combat.wave.towerId] || { armor: 0, mr: 0 };
  }

  function towerDamageMult(state, resolution) {
    const tower = state.combat.wave;
    if (state.combat.scoring.flags.bkbBlocksMods) return 1;
    for (const mod of tower.modifiers || []) {
      if (mod.id === "armor" && state.combat.fightIndex === 0) {
        // fightIndex is 0-based: 0 = first fight of the wave.
        // Butterfly evasion, one roll per fight (BKB already handled globally).
        if (state.player.items.includes("butterfly") && Rng.current().chance(0.25)) {
          Resolver.pushStep(resolution, { icon: "🎲", label: "Butterfly: броня башни уклонена!", kind: "item" });
          return 1;
        }
        Resolver.pushStep(resolution, { icon: "☠", label: "Armor T2: первый бой волны — урон ×0.5", kind: "modifier" });
        return 0.5;
      }
      if (mod.id === "glyph" && state.combat.fightIndex % 3 === 2) {
        // every 3rd fight: #3, #6, ...
        Resolver.pushStep(resolution, { icon: "☠", label: "Glyph T3: бой заблокирован полностью!", kind: "modifier" });
        return 0;
      }
    }
    return 1;
  }

  function enemyShieldMult(state) {
    // Enemy picked up the Divine Rapier after a failed wave.
    return (state.combat.wave.enemyItems || []).includes("rapier") ? 0.5 : 1;
  }

  // Оверкилл-золото: делители привязаны к росту HP по актам, кап — 3× награды
  // за волну. Иначе поздние акты печатают золото из больших пулов HP.
  function overkillGold(state, overkill) {
    if (overkill <= 0) return 0;
    const wave = state.combat.wave;
    const halfCap = Math.floor(wave.maxHp * 0.5);
    const fast = Math.min(overkill, halfCap);
    const slow = Math.max(0, overkill - halfCap);
    const raw = Math.floor(fast / 60) + Math.floor(slow / 120);
    const cap = (wave.gold || 6) * 3;
    return Math.min(cap, Math.floor(raw * state.combat.scoring.flags.overkillRate));
  }

  // Runs the whole fight against state.combat.wave. Mutates state.
  function resolveFight(state) {
    const resolution = Resolver.createResolution(state);
    const played = realPlayedCards(state);
    played.forEach((c, i) => (c.slotIndex = i));

    state.combat.scoring = { power: 0, mult: 1, finalMult: 1, flags: { ignoreTowerMods: false, overkillRate: 1, refreshHeroTriggers: false, bkbBlocksMods: state.player.items.includes("bkb"), lastHitGold: 0 } };

    // Проклятия элитной башни: BKB выключает их все.
    const curses = state.combat.scoring.flags.bkbBlocksMods ? [] : waveCurses(state);
    const silenced = curses.includes("silence");
    if (silenced) {
      Resolver.pushStep(resolution, { icon: "☠", label: "Безмолвие: способности героев отключены", kind: "modifier" });
    }

    // 1-2. Pre-detect + detection.
    const { effective, combo, copyLog } = buildEffectiveSet(state, played, resolution);
    resolution.combo = combo;
    if (state.rules === "formation") {
      Resolver.pushStep(resolution, {
        icon: "🧩",
        label: `Формация «${combo.name}» (тир ${combo.tier}): ${combo.formPower} × ${combo.formMult}, ${Content.damageTypeNames[combo.damageType]} урон`,
        kind: "combo",
      });
      for (const bond of combo.bonds) {
        const parts = [];
        if (bond.power) parts.push("+" + bond.power + " силы");
        if (bond.mult) parts.push("+" + bond.mult + " к множителю");
        if (parts.length) {
          Resolver.pushStep(resolution, { icon: "🔗", label: `Связка «${bond.trait}»: ${parts.join(", ")}`, kind: "bond" });
        }
      }
    } else {
      Resolver.pushStep(resolution, {
        icon: "🃏",
        label: `Комбо: ${combo.name} (база ${combo.basePower} × ${combo.baseMult})`,
        kind: "combo",
      });
    }

    // 3. Base power + played card powers (туман: ранг ≤4 не даёт силы).
    const fog = curses.includes("fog");
    state.combat.scoring.power = combo.basePower;
    let cardPowerSum = 0;
    for (const card of effective) {
      if (fog && card.power <= 4) continue;
      cardPowerSum += card.power;
    }
    if (fog && effective.some((c) => c.power <= 4)) {
      Resolver.pushStep(resolution, { icon: "☠", label: "Туман войны: герои ранга ≤4 не дают силы", kind: "modifier" });
    }
    state.combat.scoring.power += cardPowerSum;
    state.combat.scoring.mult = combo.baseMult;
    state.combat.scoring.effective = effective;
    state.combat.scoring.copyLog = copyLog;

    // 4. Hero triggers.
    runTriggers(state, resolution, { playedCards: effective, combo, scoring: state.combat.scoring, simulate: state.simulate }, silenced ? [] : ["hero"]);

    // 5. Item triggers.
    runTriggers(state, resolution, { playedCards: effective, combo, scoring: state.combat.scoring, simulate: state.simulate }, ["item"]);

    // 6. Refresher: hero triggers again.
    if (state.combat.scoring.flags.refreshHeroTriggers && !silenced) {
      runTriggers(state, resolution, { playedCards: effective, combo, scoring: state.combat.scoring, simulate: state.simulate, onlyKinds: ["hero"], refreshed: true }, ["hero"]);
    }

    // 6.5 Ставка: чем больше отряд, тем жирнее удар.
    const commit = COMMIT_TIERS[played.length];
    if (commit && commit.finalMult !== 1) {
      state.combat.scoring.finalMult *= commit.finalMult;
      Resolver.pushStep(resolution, {
        icon: "🎖",
        label: `Ставка «${commit.name}» (${played.length} героев): ×${commit.finalMult} к урону`,
        kind: "info",
      });
    }

    // 6.6 Импульс: серия зачищенных волн.
    const momentumStacks = Math.min(state.run.momentum || 0, MOMENTUM_CAP);
    if (momentumStacks > 0) {
      const momentumMult = 1 + momentumStacks * MOMENTUM_STEP;
      state.combat.scoring.finalMult *= momentumMult;
      Resolver.pushStep(resolution, {
        icon: "🔥",
        label: `Импульс ${momentumStacks} волн подряд: ×${round2(momentumMult)} к урону`,
        kind: "info",
      });
    }

    // 7. Tower modifiers + проклятия элиты.
    let curseMultiplier = 1;
    if (curses.includes("adaptation") && state.combat.lastComboType === combo.type) {
      curseMultiplier *= 0.5;
      Resolver.pushStep(resolution, { icon: "☠", label: "Адаптация: повтор комбинации ×0.5", kind: "modifier" });
    }
    if (curses.includes("bastion") && (state.rules === "formation" ? combo.tier <= 1 : Content.combos.byId[combo.type].rank <= 2)) {
      curseMultiplier *= 0.5;
      Resolver.pushStep(resolution, { icon: "☠", label: "Фортификация: малое комбо ×0.5", kind: "modifier" });
    }
    const towerMult = towerDamageMult(state, resolution) * enemyShieldMult(state) * curseMultiplier;
    resolution.blocked = towerMult === 0;

    // 8. Damage.
    const s = state.combat.scoring;
    let damage;
    if (state.rules === "formation") {
      // Третья ось: тип урона против числовой защиты цели (до волновых модов).
      const raw = s.power * s.mult * s.finalMult;
      const baseDefense = towerDefenseOf(state);
      const defense = s.flags.pierceMr ? { armor: baseDefense.armor, mr: 0 } : baseDefense;
      const pen = s.flags.armorPen || 0;
      const mitigated = FormationSys.mitigate(raw, combo.damageType, defense, pen);
      if (state.combat.scoring.flags.bkbBlocksMods) {
        Resolver.pushStep(resolution, { icon: "🛡", label: "BKB: числовая защита башни игнорируется", kind: "modifier" });
      } else if (combo.damageType === "pure") {
        Resolver.pushStep(resolution, { icon: "✦", label: "Чистый урон: броня и сопротивление игнорируются", kind: "info" });
      } else if (combo.damageType === "magical" && defense.mr) {
        Resolver.pushStep(resolution, { icon: "✺", label: `Сопротивление ${Math.round(defense.mr * 100)}%: ${Math.round(raw)} → ${mitigated}`, kind: "modifier" });
      } else if (defense.armor) {
        const effArmor = Math.max(0, defense.armor - pen);
        const absorbed = Math.min(effArmor, raw * 0.5);
        const penNote = pen ? ` (−${Math.min(pen, defense.armor)} коррозия)` : "";
        Resolver.pushStep(resolution, { icon: "🛡", label: `Броня башни ${effArmor}${penNote}: −${Math.round(absorbed)} (${Math.round(raw)} → ${mitigated})`, kind: "modifier" });
      }
      damage = Math.round(mitigated * towerMult);
    } else {
      damage = resolution.blocked ? 0 : Math.round(s.power * s.mult * s.finalMult * towerMult);
    }
    // Осада (TOWER_BURN): чистый добор поверх удара, глиф блокирует всё.
    if (!resolution.blocked && s.flags.towerBurn) {
      damage += s.flags.towerBurn;
      Resolver.pushStep(resolution, { icon: "☄", label: `Осада: +${s.flags.towerBurn} чистого урона по башне`, kind: "item" });
    }
    resolution.damageType = combo.damageType || null;
    resolution.power = s.power;
    resolution.mult = s.mult;
    resolution.damage = damage;
    Resolver.pushStep(resolution, {
      icon: "⚔",
      label: `Урон: ${s.power} × ${round2(s.mult)}${s.finalMult !== 1 ? " × " + round2(s.finalMult) : ""}${towerMult !== 1 ? " × " + round2(towerMult) : ""} = ${damage}`,
      kind: "damage",
    });

    // 9. Apply damage / death / aegis.
    const tower = state.combat.wave;
    const hpBefore = tower.hp;
    tower.hp -= damage;
    const overkill = Math.max(0, damage - hpBefore);
    resolution.towerHpAfter = Math.max(0, tower.hp);

    if (tower.hp <= 0) {
      const aegis = (tower.modifiers || []).find((m) => m.id === "aegis");
      if (aegis && !tower.aegisUsed && !s.flags.denyRevive) {
        tower.aegisUsed = true;
        const def = Content.modifiers.byId["aegis"];
        const result = Effects.apply({ type: "REVIVE", hpPercent: def.hpPercent }, {
          state,
          scoring: s,
          sourceName: "Roshan",
        });
        Resolver.pushStep(resolution, { icon: "☠", label: result.label, kind: "modifier" });
        resolution.killed = false;
      } else {
        resolution.killed = true;
      }
    }

    // 10. Gold from overkill + exact last hit.
    let gold = overkillGold(state, overkill);
    if (gold > 0) {
      Resolver.pushStep(resolution, { icon: "💰", label: `Overkill +${gold} золота`, kind: "gold" });
    }
    if (!resolution.blocked && damage === hpBefore && hpBefore > 0) {
      gold += 5;
      Resolver.pushStep(resolution, { icon: "🎯", label: "Last Hit! +5 золота", kind: "gold" });
      const track = s.flags.lastHitGold || 0;
      if (track) {
        gold += track;
        Resolver.pushStep(resolution, { icon: "💰", label: `Track: +${track} золота за точный ласт-хит`, kind: "gold" });
      }
    }
    if (commit && commit.gold) {
      gold += commit.gold;
      Resolver.pushStep(resolution, { icon: "💰", label: `Харас (1 герой): +${commit.gold} золото`, kind: "gold" });
    }
    resolution.goldGained = gold;
    state.run.gold += gold;

    state.stats.totalDamage += damage;
    if (damage > state.stats.biggestHit) state.stats.biggestHit = damage;

    // Cycle: played cards go to discard (illusions vanish), draw back to hand size.
    DeckSys.moveToDiscard(state, state.combat.selectedUids);
    state.combat.selectedUids = [];
    DeckSys.draw(state, Rng.current());
    state.player.fightsLeft -= 1;
    state.combat.fightIndex += 1;
    state.combat.lastComboType = combo.type; // для проклятия «Адаптация»
    state.combat.lastResolution = resolution;
    state.combat.scoring = null;
    return resolution;
  }

  function runTriggers(state, resolution, payload, kinds) {
    Triggers.runEvent(state, null, "ON_PLAY", { ...payload, onlyKinds: kinds }, resolution);
    Triggers.runEvent(state, null, "COMBO_DETECTED", { ...payload, onlyKinds: kinds }, resolution);

// Dalatro — economy: shop offers with rarity weights and lock support.
// Offers are objects: { id, locked }. Buy/sell/reroll math lives in game.js.
const Economy = (function () {
  const REROLL_COST = 2;
  const OFFER_SLOTS = 5;
  // Rarity weights per offer slot (epic stays special).
  const RARITY_WEIGHTS = { common: 62, rare: 28, epic: 10 };

  function pickRarity(rng) {
    const total = RARITY_WEIGHTS.common + RARITY_WEIGHTS.rare + RARITY_WEIGHTS.epic;
    let roll = rng.next() * total;
    for (const rarity of ["common", "rare", "epic"]) {
      roll -= RARITY_WEIGHTS[rarity];
      if (roll < 0) return rarity;
    }
    return "common";
  }

  // Fills up to `slots` offers from items not owned and not already offered.
  // guaranteeEpic: элитная башня — в лавке будет хотя бы один эпик.
  function generateOffers(state, slots = OFFER_SLOTS, keepLocked = [], guaranteeEpic = false) {
    const rng = Rng.current();
    const offers = keepLocked.slice();
    const taken = new Set(offers.map((o) => o.id).concat(state.player.items));
    let guard = 60; // pool can be exhausted — never loop forever
    while (offers.length < slots && guard-- > 0) {
      const rarity = pickRarity(rng);
      const pool = Content.items.list
        .map((i) => i.id)
        .filter((id) => !taken.has(id) && Content.items.byId[id].rarity === rarity);
      if (!pool.length) continue;
      const id = rng.pick(pool);
      taken.add(id);
      offers.push({ id, locked: false });
    }
    if (guaranteeEpic && !offers.some((o) => Content.items.byId[o.id].rarity === "epic")) {
      const epics = Content.items.list
        .map((i) => i.id)
        .filter((id) => !taken.has(id) && Content.items.byId[id].rarity === "epic");
      if (epics.length) {
        const swapIdx = offers.findIndex((o) => !o.locked);
        if (swapIdx !== -1) {
          taken.delete(offers[swapIdx].id);
          const id = rng.pick(epics);
          offers[swapIdx] = { id, locked: false };
          taken.add(id);
        }
      }
    }
    return offers;
  }

  function sellValue(itemId) {
    const item = Content.items.byId[itemId];
    return Math.floor(item.cost / 2);
  }

  return { generateOffers, sellValue, REROLL_COST, OFFER_SLOTS };
})();

  <script>
// Dalatro — build advisor. Turns the run's deck + items into visible build
// directions (progress bars) and per-item synergy explanations for the shop.
// Pure analysis: reads state, mutates nothing.
const Advisor = (function () {
  function deckHeroes(state) {
    return Object.values(state.cards).map((c) => Content.heroes.byId[c.heroId]);
  }

  function countBy(arr, key) {
    const map = new Map();
    for (const x of arr) map.set(x[key], (map.get(x[key]) || 0) + 1);
    return map;
  }

  // Longest run of consecutive powers in the deck.
  function longestStraight(values) {
    const distinct = Array.from(new Set(values)).sort((a, b) => a - b);
    let best = { len: 1, from: distinct[0] };
    let len = 1;
    for (let i = 1; i < distinct.length; i++) {
      len = distinct[i] === distinct[i - 1] + 1 ? len + 1 : 1;
      if (len > best.len) best = { len, from: distinct[i - len + 1] };
    }
    return { len: best.len, from: best.from, to: best.from + best.len - 1 };
  }

  // Build directions visible in the shop. Sorted: closest to complete first.
  function analyzeBuilds(state) {
    const heroes = deckHeroes(state);
    const owned = new Set(state.player.items);
    const builds = [];

    // Flush lines per attribute.
    const byAttr = countBy(heroes, "attr");
    for (const [attr, n] of byAttr) {
      if (n >= 3) {
        builds.push({
          key: "flush_" + attr,
          name: `Тимфайт ${Content.attrNames[attr]}`,
          have: n, need: 5,
          hint: "Пять героев одного атрибута = флеш: 35 × 4",
        });
      }
    }

    // Straight run.
    const straight = longestStraight(heroes.map((h) => h.power));
    if (straight.len >= 3) {
      const missing = [];
      for (let v = straight.from; v <= straight.to; v++) {
        if (!heroes.some((h) => h.power === v)) missing.push(v);
      }
      builds.push({
        key: "straight",
        name: "Смок-стрит",
        have: straight.len, need: 5,
        hint: missing.length
          ? `Ранги ${straight.from}–${straight.to} есть, не хватает силы ${missing.join(" и ")}`
          : `Ранги ${straight.from}–${straight.to} собраны — играй их вместе`,
      });
    }

    // Trips.
    const byPower = countBy(heroes, "power");
    for (const [power, n] of byPower) {
      if (n >= 3) {
        builds.push({
          key: "trips_" + power,
          name: `Ганг силы ${power}`,
          have: n, need: 3,
          hint: `Три героя силы ${power} — ганг; +2 к фулл-хаусу с любой парой`,
        });
      }
    }

    // Crit build: Daedalus + PA + Refresher.
    const critPieces =
      (owned.has("daedalus") ? 1 : 0) +
      (heroes.some((h) => h.id === "pa") ? 1 : 0) +
      (owned.has("refresher") ? 1 : 0);
    if (critPieces >= 1) {
      builds.push({
        key: "crit",
        name: "Крит-билд",
        have: critPieces, need: 3,
        hint: "Daedalus (25% ×2) + Phantom Assassin (50% ×2) + Refresher (двойной рол)",
      });
    }

    // Morph engine: Morphling + Zeus.
    const hasMorph = heroes.some((h) => h.id === "morphling");
    const hasZeus = heroes.some((h) => h.id === "zeus");
    if (hasMorph && hasZeus) {
      builds.push({
        key: "morph_engine",
        name: "Морф-движок",
        have: hasMorph && hasZeus ? 2 : 1, need: 2,
        hint: "Zeus в руке слева от Morphling: морф копирует INT, зевс +2 к множителю",
      });
    }

    // Rank manipulation: Butterfly + Manta + Shadow Blade.
    const rulePieces =
      (owned.has("butterfly") ? 1 : 0) +
      (owned.has("manta") ? 1 : 0) +
      (owned.has("shadow_blade") ? 1 : 0);
    if (rulePieces >= 2) {
      builds.push({
        key: "ranksmith",
        name: "Кузня рангов",
        have: rulePieces, need: 3,
        hint: "Butterfly ± ранг слабейшего, Shadow Blade +1 сильнейшего, Manta копия — комбо собираются из ничего",
      });
    }

    return builds
      .map((b) => ({ ...b, pct: Math.min(100, Math.round((b.have / b.need) * 100)) }))
      .sort((a, b) => b.pct - a.pct)
      .slice(0, 6);
  }

  // "What does THIS item give THIS run" — shown in the shop hover panel.
  function itemSynergy(itemId, state) {
    const heroes = deckHeroes(state);
    const owned = new Set(state.player.items);
    const heroIds = new Set(heroes.map((h) => h.id));
    const lines = [];
    const has = (id) => heroIds.has(id);

    switch (itemId) {
      case "daedalus":
        if (has("pa")) lines.push("Phantom Assassin в колоде — два независимых источника ×2");
        if (owned.has("refresher")) lines.push("Refresher Orb — крит прокатится дважды");
        break;
      case "refresher":
        lines.push(`Усилит ${heroes.filter((h) => h.ability).length} способностей героев колоды`);
        if (owned.has("daedalus") || has("pa")) lines.push("Криты смогут сработать дважды за бой");
        break;
      case "satanic": {
        const pairs = Array.from(countBy(heroes, "power").entries()).filter(([, n]) => n >= 2).map(([p]) => p);
        if (pairs.length) lines.push(`В колоде стабильные пары силы ${pairs.join(", ")} — Satanic будет жечь почти каждый бой`);
        break;
      }
      case "manta": {
        const pairs = Array.from(countBy(heroes, "power").entries()).filter(([, n]) => n >= 2).map(([p]) => p);
        if (pairs.length) lines.push(`Иллюзия превращает пару силы ${pairs.join("/")} в сет или фулл-хаус`);
        if (has("morphling")) lines.push("Morphling: иллюзия наследует его ранг и атрибут");
        break;
      }
      case "butterfly":
        lines.push("Игра применит ±ранг только если он улучшает комбо — минуса нет");
        if (has("cm")) lines.push("CM (2) → 3: из {2,3,5,5} собираются две пары");
        break;
      case "shadow_blade":
        lines.push("±1 ранг сильнейшей карты: 9+10 превращаются в пару 10-10 — игра берёт только улучшение");
        break;
      case "radiance":
        lines.push("Полная пятёрка героев = +15 силы");
        if (owned.has("drum") || owned.has("meteor_hammer")) lines.push("Дружит с билдом «играй много героев»");
        break;
      case "octarine": {
        const n = state.player.items.length;
        lines.push(`Сейчас предметов: ${n} → +${n} к множителю за каждый бой`);
        lines.push("Покупай вместе с ним — ядро растёт");
        break;
      }
      case "vladmir":
        lines.push("≈ +8 золота за волну (4 боя) — окупается за волну");
        break;
      case "midas":
        lines.push("Удваивает золото с оверкилла — бей точно в ноль HP для ласт-хита");
        break;
      case "rapier":
        lines.push("Сейчас: ×2 к итоговому урону каждого боя");
        lines.push("Провал волны = рапира у врага (×0.5 к твоему урону по нему)");
        break;
      case "bkb": {
        const nextWave = Content.waves.byId[Content.waves.order[state.run.waveIndex + 1]];
        if (nextWave && nextWave.modifiers.length) {
          const defs = nextWave.modifiers.map((m) => Content.modifiers.byId[m.id].name).join(", ");
          lines.push(`Следующая башня: ${nextWave.name} (${defs}) — BKB это игнорирует`);
        } else {
          lines.push("Ближайшие башни без модификаторов — прибереги или продай");
        }
        break;
      }
      case "sentry": {
        const minesWave = Content.waves.order
          .slice(state.run.waveIndex + 1)
          .map((id) => Content.waves.byId[id])
          .find((w) => (w.modifiers || []).some((m) => m.id === "mines"));
        if (minesWave) lines.push(`Впереди ${minesWave.name}: без вардов каждый бой теряет 2 карты руки`);
        else lines.push("Techies остались позади — Sentry больше не нужен, можно продать");
        break;
      }
      case "bloodstone": {
        const lost = Math.max(0, 6 - state.run.barracks);
        lines.push(lost
          ? `Сейчас +${lost * 0.5} к множителю (${lost} казарм потеряно)`
          : "Казармы целы — камень спит. Расцветает после провалов");
        break;
      }
      case "heart":
        if (byAttrHas(heroes, "str", 4)) lines.push("Флеш Силы почти собран — Heart утяжелит каждый удар");
        break;
      case "meteor_hammer":
      case "drum":
        lines.push("Сыграй 4–5 героев, чтобы триггер был стабилен");
        break;
      case "kaya":
        lines.push("Качает обе оси сразу — безопасный первый предмет");
        break;
      case "battle_fury":
        lines.push("Любит руки с одной большой картой и мусором рядом");
        break;
    }
    return lines;
  }

  function byAttrHas(heroes, attr, n) {
    return heroes.filter((h) => h.attr === attr).length >= n;
  }

  return { analyzeBuilds, itemSynergy };
})();

// Dalatro — мини-синтезатор звуков на WebAudio (порт из add1). Никаких файлов.
// Все вызовы безопасны: нет AudioContext / muted / приватный режим — тишина.
const Sfx = (function () {
  let ctx = null;
  let muted = false;
  try { muted = localStorage.getItem("dalatro-muted") === "1"; } catch (e) { /* ignore */ }

  function ac() {
    if (muted) return null;
    if (!ctx) {
      try {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        ctx = new Ctor();
      } catch (e) { return null; }
    }
    if (ctx.state === "suspended") void ctx.resume();
    return ctx;
  }

  function tone(freq, start, dur, type, gain) {
    const a = ac();
    if (!a) return;
    const osc = a.createOscillator();
    const g = a.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, a.currentTime + start);
    g.gain.setValueAtTime(0, a.currentTime + start);
    g.gain.linearRampToValueAtTime(gain || 0.06, a.currentTime + start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + start + dur);
    osc.connect(g).connect(a.destination);
    osc.start(a.currentTime + start);
    osc.stop(a.currentTime + start + dur + 0.02);
  }

  // attack: широкая «ударная» связка вместо старого одиночного тона
  function attack() {
    tone(180, 0, 0.18, "sawtooth", 0.06);
    tone(90, 0, 0.25, "sawtooth", 0.05);
    tone(440, 0.05, 0.12, "triangle", 0.05);
  }

  const LIB = {
    click: () => tone(320, 0, 0.07, "triangle", 0.04),
    select: () => { tone(520, 0, 0.08, "triangle", 0.05); tone(720, 0.04, 0.08, "triangle", 0.035); },
    discard: () => { tone(260, 0, 0.1, "sine", 0.05); tone(190, 0.06, 0.12, "sine", 0.04); },
    attack,
    buy: () => { tone(660, 0, 0.08, "triangle", 0.05); tone(880, 0.07, 0.1, "triangle", 0.05); },
    gold: () => { tone(990, 0, 0.06, "square", 0.03); tone(1320, 0.06, 0.09, "square", 0.025); },
    level: () => { tone(523, 0, 0.12, "triangle", 0.05); tone(659, 0.1, 0.12, "triangle", 0.05); tone(784, 0.2, 0.18, "triangle", 0.06); },
    path: () => { tone(392, 0, 0.12, "triangle", 0.05); tone(523, 0.1, 0.18, "triangle", 0.05); },
    win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.3, "triangle", 0.06)),
    lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, i * 0.14, 0.3, "sawtooth", 0.045)),
  };

  function play(name) {
    if (muted) return;
    try { (LIB[name] || LIB.click)(); } catch (e) { /* тишина лучше краша */ }
  }

  function isMuted() { return muted; }
  function toggleMuted() {
    muted = !muted;
    try { localStorage.setItem("dalatro-muted", muted ? "1" : "0"); } catch (e) { /* ignore */ }
    if (!muted) play("click");
    return muted;
  }

  return { play, isMuted, toggleMuted };
})();

  <script>
// Dalatro — art pool.
// Hero portraits come from Valve's public Dota 2 CDN (the canonical look).
// The hand-drawn SVG sigils stay as an automatic fallback when the CDN is
// unreachable — and as the original- art path for a public release, see
// VISUAL_SPEC.md (IP note).
const Art = (function () {
  const S = 'viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"';
  const CDN = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes";
  const ITEM_CDN = "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/items";

  // heroId -> Steam internal name (legacy names: antimage, wisp,
  // obsidian_destroyer).
  const DOTA_IMG = {
    tusk: "tusk", axe: "axe", pudge: "pudge", sven: "sven", centaur: "centaur",
    morphling: "morphling", juggernaut: "juggernaut", pa: "phantom_assassin",
    cm: "crystal_maiden", zeus: "zeus", dawnbreaker: "dawnbreaker", primal: "primal_beast",
    undying: "undying", ogre_magi: "ogre_magi", legion: "legion_commander",
    huskar: "huskar", tidehunter: "tidehunter",
    meepo: "meepo", bounty: "bounty_hunter", slark: "slark",
    phantom_lancer: "phantom_lancer", anti_mage: "antimage", faceless: "faceless_void",
    terrorblade: "terrorblade",
    oracle: "oracle", skywrath: "skywrath_mage", lina: "lina", rubick: "rubick",
    invoker: "invoker", storm_spirit: "storm_spirit", outworld: "obsidian_destroyer",
    ancient_apparition: "ancient_apparition",
    io: "wisp", muerta: "muerta", marci: "marci", snapfire: "snapfire",
    void_spirit: "void_spirit", kez: "kez", beastmaster: "beastmaster", tiny: "tiny",
  };

  const SIGILS = {
    axe: `<rect x="30" y="8" width="4" height="52"/>
      <path d="M32 6L6 12l6 12 20-4z"/>
      <path d="M32 6l26 6-6 12-20-4z"/>`,

    morphling: `<path d="M32 5c11 15 18 24 18 33a18 18 0 1 1-36 0c0-9 7-18 18-33z"/>
      <path d="M20 40c4-4 8-4 12 0s8 4 12 0" fill="none" stroke="var(--card-bg)" stroke-width="4" stroke-linecap="round"/>`,

    zeus: `<path d="M36 4L16 35h12l-5 25 21-34H31z"/>`,

    cm: `<g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <path d="M32 6v52"/><path d="M10 19l44 26"/><path d="M10 45l44-26"/></g>
      <circle cx="32" cy="32" r="7"/>`,

    juggernaut: `<path d="M13 36a19 22 0 0 1 38 0v10H13z"/>
      <path d="M12 32L4 18l12 6zM52 32l8-14-12 6z"/>
      <rect x="19" y="38" width="26" height="6" fill="var(--card-bg)"/>`,

    pa: `<path d="M32 4l9 14-3 24H26l-3-24z"/>
      <rect x="18" y="42" width="28" height="5"/>
      <rect x="28" y="47" width="8" height="13"/>`,

    pudge: `<path d="M42 4v16c0 8-24 6-24 22a13 13 0 1 0 26-2h-8a5 5 0 1 1-10-1c0-8 16-8 16-19V4z"/>`,

    tusk: `<rect x="12" y="18" width="40" height="36" rx="9"/>
      <path d="M12 30h40M12 40h40" stroke="var(--card-bg)" stroke-width="4"/>
      <path d="M22 18v-8M32 18v-8M42 18v-8" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>`,

    sven: `<path d="M32 4l21 8v22c0 15-11 22-21 26-10-4-21-11-21-26V12z"/>
      <path d="M32 12v40M20 24h24" stroke="var(--card-bg)" stroke-width="5"/>`,

    centaur: `<path d="M50 4l6 6-28 34-8-8z"/>
      <path d="M10 52l8-10 8 10 8-10 8 10 8-10" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>`,

    dawnbreaker: `<circle cx="32" cy="32" r="13"/>
      <g stroke="currentColor" stroke-width="5" stroke-linecap="round">
        <path d="M32 4v8M32 52v8M4 32h8M52 32h8M12 12l6 6M46 46l6 6M52 12l-6 6M18 46l-6 6"/></g>`,

    primal: `<path d="M14 26L32 10l18 16v16L32 58 14 42z"/>
      <path d="M22 30h20M22 38h20" stroke="var(--card-bg)" stroke-width="4"/>`,
  };

  // Attribute rune fallback for roster heroes without a bespoke sigil.
  const RUNES = {
    str: `<path d="M8 54L26 20l10 18 6-8 14 24z"/>`,
    agi: `<path d="M20 6l14 12-10 2 18 14-10 2 14 12-24-6 8-8-14-2 10-10-14-4z"/>`,
    int: `<path d="M32 12c14 0 24 12 26 20-2 8-12 20-26 20S10 40 6 32c2-8 12-20 26-20z"/>
      <circle cx="32" cy="32" r="8" fill="var(--card-bg)"/><circle cx="32" cy="32" r="4"/>`,
    uni: `<path d="M32 4l7 21h21l-17 13 7 22-18-14-18 14 7-22L4 25h21z"/>`,
  };

  function svg(inner, cls) {
    return `<svg ${S} class="${cls || ""}" aria-hidden="true">${inner}</svg>`;
  }

  function sigilFor(hero) {
    const inner = SIGILS[hero.id] || RUNES[hero.attr];
    return svg(inner, "sigil" + (SIGILS[hero.id] ? "" : " sigil-rune"));
  }

  // Portrait layered over the sigil: while the CDN image loads (or if it
  // fails offline), the sigil shows through. One removal = clean fallback.
  function heroArt(hero) {
    const key = DOTA_IMG[hero.id];
    if (!key) return sigilFor(hero);
    const url = `${CDN}/${key}.png`;
    return `<div class="hero-art">
      ${sigilFor(hero)}
      <img src="${url}" alt="${hero.name}" loading="lazy" onerror="this.remove()">
    </div>`;
  }

  // itemId -> Steam internal name (legacy: invis_sword = Shadow Blade,
  // ancient_janggo = Drum, manta = Manta Style).
  const DOTA_ITEM_IMG = {
    battle_fury: "bfury", meteor_hammer: "meteor_hammer", drum: "ancient_janggo",
    midas: "hand_of_midas", bkb: "black_king_bar", kaya: "kaya_and_sange",
    vladmir: "vladmir", sentry: "sentry_ward", daedalus: "greater_crit", satanic: "satanic",
    shadow_blade: "invis_sword", heart: "heart", refresher: "refresher",
    bloodstone: "bloodstone", butterfly: "butterfly", manta: "manta", rapier: "rapier",
    radiance: "radiance", octarine: "octarine_core",
  };

  // Item art: CDN icon over the emoji fallback (same pattern as heroArt).
  function itemIcon(item) {
    const key = DOTA_ITEM_IMG[item.id];
    if (!key) return `<span class="item-gem rar-${item.rarity}">${item.emoji}</span>`;
    return `<span class="item-gem rar-${item.rarity}">
      <span class="item-fallback">${item.emoji}</span>
      <img src="${ITEM_CDN}/${key}.png" alt="${item.name}" loading="lazy" onerror="this.remove()">
    </span>`;
  }

  return { heroArt, sigilFor, itemIcon, hasCustomSigil: (id) => !!SIGILS[id] };
})();

  const TIPS = [

  const UIState = {
    modal: null, // help | collection | settings | history | new | score | detail | null
    detail: null,
    collectionTab: "heroes",
    search: "",
    sort: "deal", // deal | rank | attr
    onboarding: false,
    onboardingStep: 0,
    motion: true,
    debugOpen: false,
    toast: "",
    tipIndex: Math.floor(Date.now() / 86400000) % TIPS.length,
    // Входные анимации играют только когда коллекция реально обновилась

    animHand: false,
    animShop: false,
    animInv: false,
    animLab: false,
    animRoute: false,
  };

  // ---------- helpers ----------

  function h(tag, cls, html) {
    return `<${tag} class="${cls || ""}">${html || ""}</${tag}>`;
  }

  function esc(str) {
    return String(str).replace(/"/g, "&quot;");
  }

  function icon(name, size) {
    return Icons.icon(name, size);
  }

  function heroDesc(hero) {
    if (hero.ability) return ABILITY_TEXT[hero.id] || hero.ability.name;
    return "Без способности — играет через ранг и атрибут.";
  }

  function attrOf(state, uid) {
    return Content.heroes.byId[state.cards[uid].heroId].attr;
  }

  function rankOf(state, uid) {
    return Content.heroes.byId[state.cards[uid].heroId].power;
  }

  // Displayed hand order (respect sort). Selection and hotkeys use it.
  function handOrder(state) {
    const uids = state.player.handUids.slice();
    if (UIState.sort === "rank") uids.sort((a, b) => rankOf(state, b) - rankOf(state, a));
    if (UIState.sort === "attr") uids.sort((a, b) => attrOf(state, a).localeCompare(attrOf(state, b)));
    return uids;
  }

  function computePreview(state) {
    if (state.phase !== "wave" || state.combat.outcome) return null;
    if (!state.combat.selectedUids.length || state.player.fightsLeft <= 0) return null;
    const clone = Sim.simulate(state, { type: "CONFIRM_FIGHT" });
    return clone ? clone.combat.lastResolution : null;
  }

  // Which combos the CURRENT HAND could assemble (not just the selection).
  function handComboState(state) {
    const heroes = state.player.handUids.map((uid) => Content.heroes.byId[state.cards[uid].heroId]);
    const byRank = new Map();
    const byAttr = new Map();
    for (const hr of heroes) {
      byRank.set(hr.power, (byRank.get(hr.power) || 0) + 1);
      byAttr.set(hr.attr, (byAttr.get(hr.attr) || 0) + 1);
    }
    const counts = [...byRank.values()].sort((a, b) => b - a);
    const ranks = [...byRank.keys()].sort((a, b) => a - b);
    let run = 1;
    let straight = false;
    for (let i = 1; i < ranks.length; i++) {
      run = ranks[i] === ranks[i - 1] + 1 ? run + 1 : 1;
      if (run >= 5) straight = true;
    }
    return {
      pair: (counts[0] || 0) >= 2,
      two_pair: counts.filter((n) => n >= 2).length >= 2,
      three: (counts[0] || 0) >= 3,
      straight,
      flush: [...byAttr.values()].some((n) => n >= 5),
      full_house: (counts[0] || 0) >= 3 && counts[1] >= 2,
    };
  }

  // Подзаголовок под названием комбо/формации. У формаций нет покерного
  // эквивалента — читаем правило и тип урона (rules: "formation").
  function comboSubtitle(combo) {
    if (combo && combo.tier != null) {
      const dt = Content.damageTypeNames[combo.damageType] || combo.damageType;
      return `${combo.rule || ""} · ${dt} урон`;
    }
    const meta = combo ? COMBO_META[combo.type] : null;
    return meta ? `${meta.poker} · ${meta.rule}` : "Сила героев × множитель";
  }

  function toast(state, text) {
    UIState.toast = text;
    clearTimeout(UIState._toastTimer);
    UIState._toastTimer = setTimeout(() => {
      UIState.toast = "";
      if (window.__dalatroRerender) window.__dalatroRerender();

  }

  // ---------- shared blocks ----------

  function brandMark() {
